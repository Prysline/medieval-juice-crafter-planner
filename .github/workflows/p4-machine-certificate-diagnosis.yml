name: P4 machine certificate diagnosis

on:
  pull_request:
    paths:
      - 'src/domain/optimizerMachineCertificateDiagnosis.test.ts'
      - '.github/workflows/p4-machine-certificate-diagnosis.yml'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      P4_MACHINE_CERTIFICATE_DIAGNOSIS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vitest run src/domain/optimizerMachineCertificateDiagnosis.test.ts --reporter=verbose
