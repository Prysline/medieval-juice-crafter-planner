name: Identity 334 harry residual exact binary split
on:
  pull_request:

jobs:
  prepare-harry-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Bernard exact and residual routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11574742299/zip" -o bernard-exact.zip
          unzip -q bernard-exact.zip -d bernard-exact
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11598948284/zip" -o bernard-routing-audit.zip
          unzip -q bernard-routing-audit.zip -d bernard-routing-audit
          gh run download "37878996313" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-bernard-binary-routing-shard-*' --dir routing-shards
          test "$(find routing-shards -name routing-results.json | wc -l)" -eq 241
      - name: Build 1732 Harry binary exact branches from 866 routed parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_harry.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-harry-binary-exact-source
          path: identity-334-harry-binary-exact-source.json
          if-no-files-found: error

  identity-334-harry-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-harry-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-harry-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run up to 20 independent Harry binary exact branches
        env:
          SHARD_PARENTS: ${{ matrix.parents_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_harry.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-harry-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-harry-binary-exact:
    if: always()
    needs: identity-334-harry-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: identity-334-harry-binary-exact-source
          path: harry-source
      - name: Download all 87 Harry exact shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-harry-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 87
      - name: Audit 1732 Harry binary exact branches
        run: python .github/scripts/diagnosis_branch21_harry.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-harry-binary-exact-audit
          path: identity-334-harry-binary-exact-audit.json
          if-no-files-found: error
