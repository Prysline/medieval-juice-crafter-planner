name: Identity187 cost-sum domain enumeration

on:
  pull_request:

jobs:
  identity187-cost-sum-domains:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '0-9'
            cases: '0:0:forbidden,0:1:required,0:1:forbidden,0:2:required,0:2:forbidden,0:4:forbidden,1:1:required,1:1:forbidden,1:2:required,1:2:forbidden,1:4:forbidden,2:1:required,2:1:forbidden,2:2:required,2:2:forbidden,2:4:forbidden,3:1:required,3:1:forbidden,3:2:required,3:2:forbidden,3:4:forbidden,4:1:required,4:1:forbidden,4:2:required,4:2:forbidden,4:4:forbidden,5:1:required,5:1:forbidden,5:2:required,5:2:forbidden,5:4:forbidden,6:1:required,6:1:forbidden,6:2:required,6:2:forbidden,6:4:forbidden,7:1:required,7:1:forbidden,7:2:required,7:2:forbidden,7:4:forbidden,8:0:required,8:0:forbidden,8:1:required,8:1:forbidden,8:2:required,8:2:forbidden,8:4:forbidden,9:0:required,9:0:forbidden,9:1:required,9:1:forbidden,9:2:required,9:2:forbidden,9:4:forbidden'
          - shard: '10-19'
            cases: '10:1:required,10:1:forbidden,10:2:required,10:2:forbidden,10:4:forbidden,11:1:required,11:1:forbidden,11:2:required,11:2:forbidden,11:4:forbidden,12:1:required,12:1:forbidden,12:2:required,12:2:forbidden,12:4:forbidden,13:1:required,13:1:forbidden,13:2:required,13:2:forbidden,13:4:forbidden,14:1:required,14:1:forbidden,14:2:required,14:2:forbidden,14:4:forbidden,15:0:required,15:0:forbidden,15:1:required,15:1:forbidden,15:2:required,15:2:forbidden,15:4:forbidden,16:1:required,16:1:forbidden,16:2:required,16:2:forbidden,16:4:forbidden,17:1:required,17:1:forbidden,17:2:required,17:2:forbidden,17:4:forbidden,18:0:forbidden,18:1:required,18:1:forbidden,18:2:required,18:2:forbidden,18:4:forbidden,19:0:forbidden,19:1:required,19:1:forbidden,19:2:required,19:2:forbidden,19:4:forbidden'
          - shard: '22-31'
            cases: '24:2:forbidden,25:2:forbidden,28:2:forbidden,29:2:forbidden,30:1:forbidden,30:2:forbidden,31:1:forbidden,31:2:forbidden'
          - shard: '34-43'
            cases: '34:0:forbidden,34:1:required,34:1:forbidden,34:2:required,34:2:forbidden,34:4:forbidden,35:0:forbidden,35:1:required,35:1:forbidden,35:2:required,35:2:forbidden,35:4:forbidden,36:2:required,36:2:forbidden,37:2:required,37:2:forbidden,39:0:required,39:0:forbidden,39:1:required,39:2:required,39:2:forbidden,40:2:required,40:2:forbidden,41:2:required,41:2:forbidden,42:2:required,42:2:forbidden,43:2:required,43:2:forbidden'
          - shard: '44-48'
            cases: '44:0:required,44:1:required,44:2:required,44:2:forbidden,45:0:required,45:0:forbidden,45:1:required,45:2:required,45:2:forbidden,46:2:required,46:2:forbidden,47:2:required,47:2:forbidden,48:2:required,48:2:forbidden'
          - shard: '49-53'
            cases: '49:2:required,49:2:forbidden,50:0:required,50:0:forbidden,50:1:required,50:2:required,50:2:forbidden,51:0:required,51:0:forbidden,51:1:required,51:2:required,51:2:forbidden,52:0:forbidden,52:2:required,52:2:forbidden,53:0:forbidden,53:2:required,53:2:forbidden'
    name: identity187-cost-sum-domains (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only multi-case cost-sum enumeration
        run: |
          node scripts/diagnosis/patchMachineContinuationListAllCostSums.mjs
          git diff --check
          git diff -- src/domain/optimizerMachineContinuationProfile.test.ts
      - name: Enumerate canonical cost-sum domains
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.cases }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_SUMS: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee identity187-cost-sums-${{ matrix.shard }}.log
          grep -q 'MACHINE_FORCED_COST_ROLE_SUMS' identity187-cost-sums-${{ matrix.shard }}.log
      - name: Upload identity187 cost-sum domains
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity187-cost-sums-${{ matrix.shard }}
          path: identity187-cost-sums-${{ matrix.shard }}.log
          if-no-files-found: error
