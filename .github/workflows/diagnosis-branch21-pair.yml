name: Identity 334 julia residual exact binary split
on:
  pull_request:

jobs:
  prepare-julia-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build Julia binary exact shards from canonical Betsy residual routing
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11532240384/zip" \
            -o betsy-exact.zip
          unzip -q betsy-exact.zip -d betsy-exact
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11538516867/zip" \
            -o julia-routing.zip
          unzip -q julia-routing.zip -d julia-routing
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          exact = json.loads(Path('betsy-exact/identity-334-betsy-binary-exact-audit.json').read_text())
          routing = json.loads(Path('julia-routing/identity-334-betsy-binary-routing-audit.json').read_text())

          assert exact['complete'] is True
          assert exact['expectedBranches'] == 12118
          assert exact['observedBranches'] == 12118
          assert exact['missingBranches'] == []
          assert exact['unexpectedBranches'] == []
          assert exact['duplicateBranches'] == []
          assert exact['malformed'] == []
          assert exact['outerFailures'] == 0
          assert exact['outerTimeouts'] == 0
          assert exact['statuses'] == {'infeasible': 2793, 'timelimit': 9325}
          assert exact['exactInfeasibleBranches'] == 2793
          assert exact['masterTimeoutBranches'] == 9325
          assert exact['roundLimitBranches'] == 0
          assert exact['fixedSupportTimeoutBranches'] == 0
          assert exact['witnessCount'] == 0
          assert exact['globalWitnessCount'] == 0
          residuals = exact['branchesByStatus']['timelimit']
          assert len(residuals) == 9325
          assert all(len(branch) == 8 and branch[-1] in (0, 1) for branch in residuals)

          assert routing['complete'] is True
          assert routing['sourceBetsyBinaryExactArtifactId'] == 11532240384
          assert routing['sourceBetsyBinaryExactRunId'] == 37727009969
          assert routing['expectedBranches'] == 9325
          assert routing['observedBranches'] == 9325
          assert routing['missingBranches'] == []
          assert routing['unexpectedBranches'] == []
          assert routing['malformed'] == []
          assert routing['outerFailures'] == 0
          assert routing['sparseCustomerCounts'] == {'julia': 9325}
          signatures = sorted(routing['routingSignatures'], key=lambda entry: entry['betsySplitIndex'])
          assert len(signatures) == 2
          assert [entry['betsySplitIndex'] for entry in signatures] == [0, 1]
          assert [entry['branchCount'] for entry in signatures] == [4678, 4647]
          assert all(entry['sparseCustomer'] == 'julia' for entry in signatures)
          julia_choices = [entry['groupIndex'] for entry in signatures[0]['candidates']]
          assert julia_choices == [60,81,120,124,160,161,163,253,270,284,287,328,329,330,331,401,419,443]
          assert all(entry['slackOnly'] is False for entry in signatures[0]['candidates'])
          assert signatures[1]['candidates'] == signatures[0]['candidates']
          julia_subsets = [julia_choices[:9], julia_choices[9:]]
          assert [len(subset) for subset in julia_subsets] == [9, 9]
          assert set(julia_subsets[0]).isdisjoint(julia_subsets[1])
          assert sorted(julia_subsets[0] + julia_subsets[1]) == julia_choices

          shards = []
          for shard_index, start in enumerate(range(0, len(residuals), 38), start=1):
              parents = residuals[start:start + 38]
              shards.append({
                  'shard': shard_index,
                  'parents_json': json.dumps(parents, separators=(',', ':')),
              })
          assert len(shards) == 246
          assert sum(len(json.loads(shard['parents_json'])) for shard in shards) == 9325
          assert max(len(json.loads(shard['parents_json'])) for shard in shards) <= 38
          assert sum(len(json.loads(shard['parents_json'])) * len(julia_subsets) for shard in shards) == 18650
          print('matrix=' + json.dumps({'include': shards}, separators=(',', ':')))
          PY

  identity-334-julia-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-julia-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-julia-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run up to 76 independent Julia binary exact branches
        env:
          SHARD_PARENTS: ${{ matrix.parents_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          source_path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          original_text = source_path.read_text()

          type_old = "    requiredUsedGroupIndexes?: readonly number[]\n    requiredSlackGroupIndexes?: readonly number[]"
          type_new = "    requiredUsedGroupIndexes?: readonly number[]\n    requiredAnyUsedGroupIndexSets?: readonly (readonly number[])[]\n    requiredSlackGroupIndexes?: readonly number[]"
          if original_text.count(type_old) != 1:
              raise SystemExit('requiredUsed options marker not unique')
          patched_text = original_text.replace(type_old, type_new)

          destructure_old = "  const requiredUsedGroupIndexes =\n    options.requiredUsedGroupIndexes ?? []\n  const requiredSlackGroupIndexes ="
          destructure_new = "  const requiredUsedGroupIndexes =\n    options.requiredUsedGroupIndexes ?? []\n  const requiredAnyUsedGroupIndexSets =\n    options.requiredAnyUsedGroupIndexSets ?? []\n  const requiredSlackGroupIndexes ="
          if patched_text.count(destructure_old) != 1:
              raise SystemExit('requiredUsed destructure marker not unique')
          patched_text = patched_text.replace(destructure_old, destructure_new)

          constraint_marker = "  requiredSlackGroupIndexes.forEach((groupIndex, index) => {"
          if patched_text.count(constraint_marker) != 1:
              raise SystemExit('requiredSlack constraint marker not unique')
          any_constraint = """  requiredAnyUsedGroupIndexSets.forEach((groupIndexes, setIndex) => {\n    const requiredAnyUsed = groupIndexes.flatMap((groupIndex) => {\n      const used = usedGroupVars[groupIndex]\n      return used ? [used] : []\n    })\n    if (requiredAnyUsed.length !== groupIndexes.length || requiredAnyUsed.length === 0) {\n      model.addConstraint(\n        sum(...usedGroupVars).leq(-1),\n        `s31s_invalid_required_any_used_${setIndex}`,\n      )\n      return\n    }\n    model.addConstraint(\n      sum(...requiredAnyUsed).geq(1),\n      `s31s_required_any_used_${setIndex}`,\n    )\n  })\n"""
          patched_text = patched_text.replace(constraint_marker, any_constraint + constraint_marker)

          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = patched_text.find(start_marker)
          end = patched_text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('test markers not found')
          base_test = patched_text[start:end]
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          marker = '[machine-extra1-pair-julia-binary-result] '
          parents = json.loads(os.environ['SHARD_PARENTS'])
          assert 1 <= len(parents) <= 38
          betsy_subsets = [
              [180, 258, 418, 489, 497, 536, 541, 547],
              [552, 554, 564, 576, 595, 619, 623, 632],
          ]
          julia_subsets = [
              [60, 81, 120, 124, 160, 161, 163, 253, 270],
              [284, 287, 328, 329, 330, 331, 401, 419, 443],
          ]
          shard_results = []
          had_outer_failure = False
          ordinal = 0

          for parent in parents:
              if len(parent) != 8 or parent[-1] not in (0, 1):
                  raise SystemExit(f'invalid Betsy residual identity: {parent!r}')
              octavius_choice, oliver_choice, hugo_choice, tiffany_choice, dominic_choice, heloise_choice, solomon_choice, betsy_split_index = parent
              betsy_subset = betsy_subsets[betsy_split_index]
              for julia_split_index, julia_subset in enumerate(julia_subsets):
                  ordinal += 1
                  betsy_literal = json.dumps(betsy_subset, separators=(',', ':'))
                  julia_literal = json.dumps(julia_subset, separators=(',', ':'))
                  lines = [
                      '',
                      '    const fixedExactGroupIndex = 334',
                      '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
                      '    const fixedExactCustomers = [...fixedExactCustomerSet]',
                      '    const requiredPair = [1052, 1070] as const',
                      '    const saviusChoice = 692',
                      '    const ambrosiaChoice = 1243',
                      f'    const octaviusChoice = {octavius_choice}',
                      f'    const oliverChoice = {oliver_choice}',
                      f'    const hugoChoice = {hugo_choice}',
                      f'    const tiffanyChoice = {tiffany_choice}',
                      f'    const dominicChoice = {dominic_choice}',
                      f'    const heloiseChoice = {heloise_choice}',
                      f'    const solomonChoice = {solomon_choice}',
                      f'    const betsySplitIndex = {betsy_split_index}',
                      f'    const betsySubset = {betsy_literal} as const',
                      f'    const juliaSplitIndex = {julia_split_index}',
                      f'    const juliaSubset = {julia_literal} as const',
                      "    expect(groups[saviusChoice].eligibleCustomerIds).toContain('savius')",
                      "    expect(groups[ambrosiaChoice].eligibleCustomerIds).toContain('ambrosia')",
                      "    expect(groups[octaviusChoice].eligibleCustomerIds).toContain('octavius')",
                      "    expect(groups[oliverChoice].eligibleCustomerIds).toContain('oliver')",
                      "    expect(groups[hugoChoice].eligibleCustomerIds).toContain('hugo')",
                      "    expect(groups[tiffanyChoice].eligibleCustomerIds).toContain('tiffany')",
                      "    expect(groups[dominicChoice].eligibleCustomerIds).toContain('dominic')",
                      "    expect(groups[heloiseChoice].eligibleCustomerIds).toContain('heloise')",
                      "    expect(groups[solomonChoice].eligibleCustomerIds).toContain('solomon')",
                      "    betsySubset.forEach((groupIndex) => expect(groups[groupIndex].eligibleCustomerIds).toContain('betsy'))",
                      "    juliaSubset.forEach((groupIndex) => expect(groups[groupIndex].eligibleCustomerIds).toContain('julia'))",
                      '    const thresholdCounts = [3, 1, 1, 0] as const',
                      '    const supportCuts: number[][] = []',
                      "    let status = 'round-limit'",
                      '    let masterSolveMs = 0',
                      '    let exactSolveMs = 0',
                      '    let exactInfeasibleSupports = 0',
                      '    let fixedSupportExactAttempts = 0',
                      '    for (let round = 0; round < 16; round += 1) {',
                      '      const built = build311ExtraCostSumSupportMaster(domain, fixedExactGroupIndex, 89, {',
                      '        supportCuts,',
                      '        includeCustomerFlow: true,',
                      '        forcedCustomerIds: fixedExactCustomers,',
                      '        requiredUsedGroupIndexes: [fixedExactGroupIndex, ...requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice, dominicChoice, heloiseChoice, solomonChoice],',
                      '        requiredAnyUsedGroupIndexSets: [betsySubset, juliaSubset],',
                      '        requiredExtraOneGroupIndexes: [...requiredPair],',
                      '      })',
                      '      const solved = await solveBounded(built.model, 0.5)',
                      '      masterSolveMs += solved.solveMs',
                      "      if (solved.status === 'infeasible') { status = 'infeasible'; break }",
                      "      if (solved.status !== 'optimal' || !solved.namedSolution) { status = solved.status; break }",
                      '      const support = groups.flatMap((_group, groupIndex) => {',
                      "        const raw = solved.namedSolution!.get(`s31su_${groupIndex}`)",
                      "        return typeof raw === 'number' && Number.isFinite(raw) && raw > 0.5 ? [groupIndex] : []",
                      '      })',
                      "      if (support.length !== 30) throw new Error(`Expected 30 support groups, got ${support.length}`)",
                      "      const exact = buildFinalizing30MaskPartitionStage(domain, new Set<ProductionStepKind>(['juicing', 'seasoning', 'blending']), thresholdCounts, { max: 76 }, 0, new Set(support))",
                      '      fixedSupportExactAttempts += 1',
                      '      const exactSolved = await solveBounded(exact.model, 3)',
                      '      exactSolveMs += exactSolved.solveMs',
                      "      if (exactSolved.status === 'infeasible') { exactInfeasibleSupports += 1; supportCuts.push(support); status = 'exact-infeasible-support'; continue }",
                      "      if (exactSolved.status === 'optimal') { status = 'global-witness'; break }",
                      "      status = `exact-${exactSolved.status}`",
                      '      break',
                      '    }',
                      "    console.info('[machine-extra1-pair-julia-binary-result]', JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, extraOneCostSum: 89, companionCost: 53, pair: requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice, dominicChoice, heloiseChoice, solomonChoice, betsySplitIndex, betsySubset, juliaSplitIndex, juliaSubset, status, supportCuts: supportCuts.length, exactInfeasibleSupports, fixedSupportExactAttempts, masterSolveMs: Math.round(masterSolveMs), exactSolveMs: Math.round(exactSolveMs) }))",
                  ]
                  source_path.write_text(patched_text[:start] + base_test + '\n'.join(lines) + patched_text[end:])
                  command = [
                      'npx', 'vitest', 'run',
                      'src/domain/optimizerMachineContinuationProfile.test.ts',
                      '--maxWorkers=1', '--minWorkers=1',
                      '-t', r'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support',
                  ]
                  try:
                      completed = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=150)
                      output = completed.stdout
                      returncode = completed.returncode
                      outer_timeout = False
                  except subprocess.TimeoutExpired as exc:
                      output = (exc.stdout or '') if isinstance(exc.stdout, str) else (exc.stdout or b'').decode(errors='replace')
                      returncode = 124
                      outer_timeout = True
                  Path(f'branch-{ordinal}.log').write_text(output)
                  clean_lines = [ansi.sub('', line) for line in output.splitlines()]
                  marked = [line for line in clean_lines if marker in line]
                  result = {
                      'branch': parent + [julia_split_index],
                      'betsySubset': betsy_subset,
                      'juliaSubset': julia_subset,
                      'outerReturnCode': returncode,
                      'outerTimeout': outer_timeout,
                      'markerCount': len(marked),
                      'solver': None,
                  }
                  if len(marked) == 1:
                      marker_index = marked[0].find(marker)
                      result['solver'] = json.loads(marked[0][marker_index + len(marker):])
                  if returncode != 0 or len(marked) != 1:
                      had_outer_failure = True
                  shard_results.append(result)

          source_path.write_text(original_text)
          Path('julia-binary-exact-results.json').write_text(json.dumps(shard_results, indent=2, sort_keys=True) + '\n')
          if had_outer_failure:
              raise SystemExit('one or more Julia binary exact branches failed or emitted an invalid result count')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-julia-binary-exact-shard-${{ matrix.shard }}
          path: |
            julia-binary-exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-julia-binary-exact:
    if: always()
    needs: identity-334-julia-binary-exact
    runs-on: ubuntu-latest
    steps:
      - name: Download all Julia binary exact shard artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-julia-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name julia-binary-exact-results.json | wc -l)" -eq 246
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11532240384/zip" \
            -o betsy-exact.zip
          unzip -q betsy-exact.zip -d betsy-exact
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11538516867/zip" \
            -o julia-routing.zip
          unzip -q julia-routing.zip -d julia-routing
      - name: Audit 18650 current-canonical Julia binary exact results
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          exact = json.loads(Path('betsy-exact/identity-334-betsy-binary-exact-audit.json').read_text())
          routing = json.loads(Path('julia-routing/identity-334-betsy-binary-routing-audit.json').read_text())
          residuals = exact['branchesByStatus']['timelimit']
          assert len(residuals) == 9325
          assert routing['complete'] is True
          assert routing['sparseCustomerCounts'] == {'julia': 9325}

          betsy_subsets = [
              [180, 258, 418, 489, 497, 536, 541, 547],
              [552, 554, 564, 576, 595, 619, 623, 632],
          ]
          julia_choices = [60,81,120,124,160,161,163,253,270,284,287,328,329,330,331,401,419,443]
          julia_subsets = [julia_choices[:9], julia_choices[9:]]
          expected = {tuple(parent + [split_index]) for parent in residuals for split_index in (0, 1)}

          results = {}
          duplicates = []
          malformed = []
          outer_failures = []
          outer_timeouts = []
          statuses = Counter()
          support_cuts = 0
          exact_infeasible_supports = 0
          fixed_support_attempts = 0
          exact_solve_ms = 0
          witnesses = []

          files = list(Path('exact-shards').rglob('julia-binary-exact-results.json'))
          if len(files) != 246:
              malformed.append({'reason': 'shard-result-count', 'count': len(files)})
          for path in files:
              entries = json.loads(path.read_text())
              if not 1 <= len(entries) <= 76:
                  malformed.append({'path': str(path), 'reason': 'branch-count', 'count': len(entries)})
              for entry in entries:
                  branch = entry.get('branch')
                  if not isinstance(branch, list) or len(branch) != 9 or branch[-2] not in (0, 1) or branch[-1] not in (0, 1):
                      malformed.append({'path': str(path), 'reason': 'branch-identity', 'branch': branch})
                      continue
                  key = tuple(branch)
                  if key in results:
                      duplicates.append(branch)
                      continue
                  results[key] = entry
                  expected_betsy = betsy_subsets[key[-2]]
                  expected_julia = julia_subsets[key[-1]]
                  if entry.get('betsySubset') != expected_betsy or entry.get('juliaSubset') != expected_julia:
                      malformed.append({'branch': branch, 'reason': 'subset-identity'})
                  if entry.get('outerReturnCode') != 0:
                      outer_failures.append(entry)
                  if entry.get('outerTimeout'):
                      outer_timeouts.append(entry)
                  solver = entry.get('solver')
                  if solver is None:
                      continue
                  if solver.get('betsySplitIndex') != key[-2] or solver.get('betsySubset') != expected_betsy:
                      malformed.append({'branch': branch, 'reason': 'solver-betsy-identity'})
                  if solver.get('juliaSplitIndex') != key[-1] or solver.get('juliaSubset') != expected_julia:
                      malformed.append({'branch': branch, 'reason': 'solver-julia-identity'})
                  status = solver.get('status')
                  if not isinstance(status, str):
                      malformed.append({'branch': branch, 'reason': 'solver-status'})
                      continue
                  statuses[status] += 1
                  support_cuts += int(solver.get('supportCuts', 0))
                  exact_infeasible_supports += int(solver.get('exactInfeasibleSupports', 0))
                  fixed_support_attempts += int(solver.get('fixedSupportExactAttempts', 0))
                  exact_solve_ms += int(solver.get('exactSolveMs', 0))
                  if status == 'global-witness':
                      witnesses.append(branch)

          observed = set(results)
          branches_by_status = {}
          for key, entry in results.items():
              solver = entry.get('solver')
              if solver is None or not isinstance(solver.get('status'), str):
                  continue
              branches_by_status.setdefault(solver['status'], []).append(list(key))
          for value in branches_by_status.values():
              value.sort()

          summary = {
              'sourceBetsyBinaryExactRunId': 37727009969,
              'sourceBetsyBinaryExactArtifactId': 11532240384,
              'sourceJuliaRoutingRunId': 37742557110,
              'sourceJuliaRoutingArtifactId': 11538516867,
              'splitKind': 'required-any-used-binary',
              'juliaCandidateGroups': julia_choices,
              'juliaSubsets': julia_subsets,
              'expectedBranches': len(expected),
              'observedBranches': len(observed),
              'missingBranches': sorted([list(key) for key in expected - observed]),
              'unexpectedBranches': sorted([list(key) for key in observed - expected]),
              'duplicateBranches': duplicates,
              'malformed': malformed,
              'outerFailures': len(outer_failures),
              'outerTimeouts': len(outer_timeouts),
              'statuses': dict(sorted(statuses.items())),
              'exactInfeasibleBranches': statuses.get('infeasible', 0),
              'masterTimeoutBranches': statuses.get('timelimit', 0),
              'roundLimitBranches': statuses.get('round-limit', 0) + statuses.get('exact-infeasible-support', 0),
              'fixedSupportTimeoutBranches': statuses.get('exact-timelimit', 0),
              'supportCuts': support_cuts,
              'exactInfeasibleSupports': exact_infeasible_supports,
              'fixedSupportExactAttempts': fixed_support_attempts,
              'exactSolveMs': exact_solve_ms,
              'witnessCount': len(witnesses),
              'globalWitnessCount': len(witnesses),
              'witnesses': witnesses,
              'branchesByStatus': branches_by_status,
              'complete': observed == expected and not duplicates and not malformed and not outer_failures and not outer_timeouts,
          }
          Path('identity-334-julia-binary-exact-audit.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({key: value for key, value in summary.items() if key != 'branchesByStatus'}, indent=2, sort_keys=True))
          assert summary['complete'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-julia-binary-exact-audit
          path: identity-334-julia-binary-exact-audit.json
          if-no-files-found: error
