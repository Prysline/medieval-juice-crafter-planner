name: Branch33 cost-sum audit

on:
  pull_request:

jobs:
  machine-forced-cost-role-187-branch33-list-sums:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { id: role0-required, spec: '33:0:required' }
          - { id: role1-required, spec: '33:1:required' }
          - { id: role1-forbidden, spec: '33:1:forbidden' }
          - { id: role2-required, spec: '33:2:required' }
          - { id: role2-forbidden, spec: '33:2:forbidden' }
    name: machine-forced-cost-role-187-branch33-list-sums (${{ matrix.case.id }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: List branch 33 canonical cost sums
        continue-on-error: true
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case.spec }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_SUMS: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch33-cost-sums-${{ matrix.case.id }}.log
      - name: Upload branch 33 cost-sum audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch33-cost-sums-${{ matrix.case.id }}
          path: branch33-cost-sums-${{ matrix.case.id }}.log
          if-no-files-found: error
