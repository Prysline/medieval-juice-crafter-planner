name: Identity 336 exact pair-identity slice 3

on:
  pull_request:

jobs:
  identity-336-exact-pair-identity-slice:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch complete exact pair-identity partition for next cells
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()

          test_start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          test_end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = text.find(test_start_marker)
          if start < 0:
              raise SystemExit('Hall-signature profile test start not found')
          end = text.find(test_end_marker, start)
          if end < 0:
              raise SystemExit('Hall-signature profile test end not found')

          test = text[start:end]
          exact_lines = [
              '',
              '    const fixedExactGroupIndex = 336',
              '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
              '    const fixedExactCustomers = [...fixedExactCustomerSet]',
              '    const thresholdCounts = [3, 1, 1, 0] as const',
              '    const exactCells = [',
              '      { extraOneCostSum: 97, companionCost: 62 },',
              '      { extraOneCostSum: 100, companionCost: 62 },',
              '      { extraOneCostSum: 102, companionCost: 62 },',
              '    ]',
              '    const exactExtraOneCandidates = groups.flatMap((group, groupIndex) => {',
              '      if (groupIndex === fixedExactGroupIndex) return []',
              '      const residualEligibleCustomerIds = group.eligibleCustomerIds.filter(',
              '        (customerId) => !fixedExactCustomerSet.has(customerId),',
              '      )',
              '      return residualEligibleCustomerIds.length >= 4',
              '        ? [{ groupIndex, ingredientCost: group.ingredientCost }]',
              '        : []',
              '    })',
              '    for (const cell of exactCells) {',
              '      const pairCandidates: Array<[number, number]> = []',
              '      for (let leftIndex = 0; leftIndex < exactExtraOneCandidates.length; leftIndex += 1) {',
              '        const left = exactExtraOneCandidates[leftIndex]',
              '        for (let rightIndex = leftIndex + 1; rightIndex < exactExtraOneCandidates.length; rightIndex += 1) {',
              '          const right = exactExtraOneCandidates[rightIndex]',
              '          if (left.ingredientCost + right.ingredientCost !== cell.extraOneCostSum) continue',
              '          if (left.ingredientCost !== cell.companionCost && right.ingredientCost !== cell.companionCost) continue',
              '          pairCandidates.push([left.groupIndex, right.groupIndex])',
              '        }',
              '      }',
              '      const pairResults = []',
              '      for (const pair of pairCandidates) {',
              '        const supportCuts: number[][] = []',
              "        let status = 'round-limit'",
              '        let masterSolveMs = 0',
              '        let exactSolveMs = 0',
              '        let exactInfeasibleSupports = 0',
              '        for (let round = 0; round < 16; round += 1) {',
              '          const built = build311ExtraCostSumSupportMaster(',
              '            domain,',
              '            fixedExactGroupIndex,',
              '            cell.extraOneCostSum,',
              '            {',
              '              supportCuts,',
              '              includeCustomerFlow: true,',
              '              forcedCustomerIds: fixedExactCustomers,',
              '              requiredExtraOneGroupIndexes: pair,',
              '            },',
              '          )',
              '          const solved = await solveBounded(built.model, 0.5)',
              '          masterSolveMs += solved.solveMs',
              "          if (solved.status === 'infeasible') {",
              "            status = 'infeasible'",
              '            break',
              '          }',
              "          if (solved.status !== 'optimal' || !solved.namedSolution) {",
              '            status = solved.status',
              '            break',
              '          }',
              '          const support = groups.flatMap((_group, groupIndex) => {',
              "            const raw = solved.namedSolution!.get(`s31su_${groupIndex}`)",
              "            return typeof raw === 'number' && Number.isFinite(raw) && raw > 0.5 ? [groupIndex] : []",
              '          })',
              '          if (support.length !== 30) {',
              "            throw new Error(`Expected 30 support groups, got ${support.length}`)",
              '          }',
              '          const exact = buildFinalizing30MaskPartitionStage(',
              '            domain,',
              "            new Set<ProductionStepKind>(['juicing', 'seasoning', 'blending']),",
              '            thresholdCounts,',
              '            { max: 76 },',
              '            0,',
              '            new Set(support),',
              '          )',
              '          const exactSolved = await solveBounded(exact.model, 3)',
              '          exactSolveMs += exactSolved.solveMs',
              "          if (exactSolved.status === 'infeasible') {",
              '            exactInfeasibleSupports += 1',
              '            supportCuts.push(support)',
              "            status = 'exact-infeasible-support'",
              '            continue',
              '          }',
              "          if (exactSolved.status === 'optimal') {",
              "            status = 'global-witness'",
              '            break',
              '          }',
              "          status = `exact-${exactSolved.status}`",
              '          break',
              '        }',
              '        const pairResult = {',
              '          pair,',
              '          status,',
              '          supportCuts: supportCuts.length,',
              '          exactInfeasibleSupports,',
              '          masterSolveMs: Math.round(masterSolveMs),',
              '          exactSolveMs: Math.round(exactSolveMs),',
              '        }',
              '        pairResults.push(pairResult)',
              '        console.info(',
              "          '[machine-extra1-pair-identity-result]',",
              '          JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, ...cell, ...pairResult }),',
              '        )',
              '      }',
              '      console.info(',
              "        '[machine-extra1-pair-identity-cell]',",
              '        JSON.stringify({',
              '          fixedGroupIndex: fixedExactGroupIndex,',
              '          ...cell,',
              '          pairCount: pairCandidates.length,',
              "          status: pairResults.length > 0 && pairResults.every((entry) => entry.status === 'infeasible') ? 'infeasible' : 'unresolved',",
              "          unresolvedPairs: pairResults.filter((entry) => entry.status !== 'infeasible').map((entry) => ({ pair: entry.pair, status: entry.status })),",
              '        }),',
              '      )',
              '    }',
          ]
          test = test + '\n'.join(exact_lines)
          text = text[:start] + test + text[end:]
          path.write_text(text)
          PY
      - name: Run complete exact pair-identity partition
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t 'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support' 2>&1 | tee identity-336-exact-pair-identity-slice.log
          grep -F '[machine-extra1-pair-identity-result]' identity-336-exact-pair-identity-slice.log | tee identity-336-exact-pair-results.log
          grep -F '[machine-extra1-pair-identity-cell]' identity-336-exact-pair-identity-slice.log | tee identity-336-exact-pair-cells.log
          test "$(wc -l < identity-336-exact-pair-cells.log)" -eq 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-336-exact-pair-identity-slice
          path: |
            identity-336-exact-pair-identity-slice.log
            identity-336-exact-pair-results.log
            identity-336-exact-pair-cells.log
          if-no-files-found: error
