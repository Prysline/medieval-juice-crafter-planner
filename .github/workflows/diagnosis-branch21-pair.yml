name: Identity 334 gonzalo residual exact binary split
on:
  pull_request:

jobs:
  prepare-gonzalo-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download William exact and routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38036932114 --repo Prysline/medieval-juice-crafter-planner --name identity-334-william-binary-exact-audit --dir william-exact
          gh run download 38041611414 --repo Prysline/medieval-juice-crafter-planner --name identity-334-william-binary-routing-audit --dir william-routing
          gh run download 38041611414 --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-william-binary-routing-shard-*' --dir william-routing-shards
          test "$(find william-routing-shards -name routing-results.json | wc -l)" -eq 44
      - name: Build 5258 Gonzalo binary exact branches from 2629 routed parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_gonzalo.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-gonzalo-binary-exact-source
          path: identity-334-gonzalo-binary-exact-source.json
          if-no-files-found: error

  identity-334-gonzalo-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-gonzalo-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-gonzalo-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run 22 independent Gonzalo binary exact branches
        env:
          SHARD_PARENTS: ${{ matrix.parents_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_gonzalo.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-gonzalo-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-gonzalo-binary-exact:
    if: always()
    needs: identity-334-gonzalo-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Gonzalo exact source and all 239 shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-gonzalo-binary-exact-source --dir gonzalo-source
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-gonzalo-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 239
      - name: Audit all 5258 Gonzalo binary exact branches
        run: python .github/scripts/diagnosis_branch21_gonzalo.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-gonzalo-binary-exact-audit
          path: identity-334-gonzalo-binary-exact-audit.json
          if-no-files-found: error
