name: Branch33 exact identity residuals

on:
  pull_request:

jobs:
  machine-forced-cost-role-187-branch33-identity:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sum: '114'
            firstIdentity: '43'
          - sum: '119'
            firstIdentity: '1184'
    name: machine-forced-cost-role-187-branch33-identity (${{ matrix.sum }}, ${{ matrix.firstIdentity }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Solve branch 33 exact identity residual
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '33:2:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '${{ matrix.sum }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '${{ matrix.firstIdentity }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch33-identity-${{ matrix.sum }}-${{ matrix.firstIdentity }}.log
      - name: Upload branch 33 identity residual log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch33-identity-${{ matrix.sum }}-${{ matrix.firstIdentity }}
          path: branch33-identity-${{ matrix.sum }}-${{ matrix.firstIdentity }}.log
          if-no-files-found: error
