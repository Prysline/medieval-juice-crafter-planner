name: Identity 334 post-Nicholas routed residual exact binary split
on:
  pull_request:

jobs:
  prepare-post-nicholas-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Nicholas exact and routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38062004689 --repo Prysline/medieval-juice-crafter-planner --name identity-334-nicholas-binary-exact-audit --dir nicholas-exact
          gh run download 38067144653 --repo Prysline/medieval-juice-crafter-planner --name identity-334-nicholas-binary-routing-audit --dir nicholas-routing
          gh run download 38067144653 --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-nicholas-binary-routing-shard-*' --dir nicholas-routing-shards
          test "$(find nicholas-routing-shards -name routing-results.json | wc -l)" -eq 91
      - name: Build 10880 routed binary exact branches from 5440 Nicholas residual parents
        id: matrix
        run: |
          python .github/scripts/diagnosis_branch21_post_nicholas.py prepare > /tmp/full-matrix.txt
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('matrix=' + json.dumps({'include': [{'shard': i} for i in range(1, 249)]}, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-post-nicholas-routed-binary-exact-source
          path: identity-334-post-nicholas-routed-binary-exact-source.json
          if-no-files-found: error

  identity-334-post-nicholas-routed-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-post-nicholas-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-post-nicholas-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Download validated routed exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-post-nicholas-routed-binary-exact-source --dir post-nicholas-source
      - name: Select this exact shard's 22 routed parents
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          source = json.loads(Path('post-nicholas-source/identity-334-post-nicholas-routed-binary-exact-source.json').read_text())
          parents = source['parentBranches']
          assert len(parents) == 5440
          shard = int(os.environ['SHARD_INDEX'])
          assert 1 <= shard <= 248
          chunk = parents[(shard - 1) * 22:shard * 22]
          assert len(chunk) == (6 if shard == 248 else 22)
          print('SHARD_PARENTS=' + json.dumps(chunk, separators=(',', ':')))
          PY
      - name: Run up to 44 independent post-Nicholas routed binary exact branches
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_post_nicholas.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-post-nicholas-routed-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-post-nicholas-routed-binary-exact:
    if: always()
    needs: identity-334-post-nicholas-routed-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download routed exact source and all 248 shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-post-nicholas-routed-binary-exact-source --dir post-nicholas-source
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-post-nicholas-routed-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 248
      - name: Audit all 10880 post-Nicholas routed binary exact branches
        run: python .github/scripts/diagnosis_branch21_post_nicholas.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-post-nicholas-routed-binary-exact-audit
          path: identity-334-post-nicholas-routed-binary-exact-audit.json
          if-no-files-found: error
