    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Solve branch 32 exact first-cost bucket
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '32:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '${{ matrix.sum }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_COSTS: '${{ matrix.firstCost }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch32-first-cost-${{ matrix.sum }}-${{ matrix.firstCost }}.log
      - name: Upload branch 32 first-cost log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch32-first-cost-${{ matrix.sum }}-${{ matrix.firstCost }}
          path: branch32-first-cost-${{ matrix.sum }}-${{ matrix.firstCost }}.log
          if-no-files-found: error
