name: Identity187 canonical branch enumeration

on:
  pull_request:

jobs:
  identity187-list-branches:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Enumerate canonical identity187 branches
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_BRANCHES: '1'
        run: |
          set +e
          set -o pipefail
          node scripts/diagnosis/patchMachineContinuationListBranches.mjs
          git diff --check
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee identity187-branches.log
          vitest_status=${PIPESTATUS[0]}
          set -e
          test "$vitest_status" -ne 0
          grep -q 'MACHINE_FORCED_COST_ROLE_BRANCHES' identity187-branches.log
      - name: Upload identity187 branch enumeration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity187-branches
          path: identity187-branches.log
          if-no-files-found: error
