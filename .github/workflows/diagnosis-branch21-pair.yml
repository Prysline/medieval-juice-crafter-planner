name: Branch26 remaining required pair exact

on:
  pull_request:

jobs:
  machine-forced-cost-role-187-branch26-sum117-pair:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { first: 43, second: 1184 }
          - { first: 568, second: 1184 }
    name: machine-forced-cost-role-187-branch26-sum117-pair (${{ matrix.pair.first }}-${{ matrix.pair.second }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only exact pair selectors
        run: python .github/diagnostics/apply-branch20-pair-choice-selectors.py
      - name: Solve branch 26 sum117 exact pair survivor
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '26:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '117'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '${{ matrix.pair.first }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SECOND_IDENTITIES: '${{ matrix.pair.second }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch26-sum117-pair-${{ matrix.pair.first }}-${{ matrix.pair.second }}.log
      - name: Upload branch 26 sum117 pair log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch26-sum117-pair-${{ matrix.pair.first }}-${{ matrix.pair.second }}
          path: branch26-sum117-pair-${{ matrix.pair.first }}-${{ matrix.pair.second }}.log
          if-no-files-found: error

  machine-forced-cost-role-187-branch26-sum118-hugo452-next:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only exact pair selectors
        run: python .github/diagnostics/apply-branch20-pair-choice-selectors.py
      - name: Solve branch 26 sum118 986+1184 Hugo452 next sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '26:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '118'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '986'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SECOND_IDENTITIES: '1184'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER_CHOICES: '452'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_NEXT_CUSTOMER: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch26-sum118-986-1184-hugo452-next.log
      - name: Upload branch 26 sum118 Hugo452 next log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch26-sum118-986-1184-hugo452-next
          path: branch26-sum118-986-1184-hugo452-next.log
          if-no-files-found: error
