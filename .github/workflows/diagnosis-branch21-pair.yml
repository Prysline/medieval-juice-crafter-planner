name: Identity187 residual cost-sum enumeration

on:
  pull_request:

jobs:
  identity187-residual-cost-sums:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - '9:0:required'
          - '19:0:forbidden'
          - '39:0:required'
          - '45:0:required'
          - '50:0:required'
    name: identity187-residual-cost-sums (${{ matrix.case }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only cost-sum enumeration
        run: |
          node scripts/diagnosis/patchMachineContinuationListAllCostSums.mjs
          git diff --check
          git diff -- src/domain/optimizerMachineContinuationProfile.test.ts
      - name: Enumerate canonical cost-sum domain
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_SUMS: '1'
        run: |
          set -o pipefail
          safe_case="$(printf '%s' '${{ matrix.case }}' | tr ':' '-')"
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee "identity187-cost-sums-${safe_case}.log"
          grep -q 'MACHINE_FORCED_COST_ROLE_SUMS' "identity187-cost-sums-${safe_case}.log"
      - name: Upload cost-sum domain log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity187-cost-sums-${{ strategy.job-index }}
          path: identity187-cost-sums-*.log
          if-no-files-found: error
