name: Identity 336 smallest exact pair slice

on:
  pull_request:

jobs:
  identity-336-smallest-exact-pair-slice:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch smallest residual cells into exact customer-flow diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()

          test_start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          test_end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = text.find(test_start_marker)
          if start < 0:
              raise SystemExit('Hall-signature profile test start not found')
          end = text.find(test_end_marker, start)
          if end < 0:
              raise SystemExit('Hall-signature profile test end not found')

          test = text[start:end]
          exact_lines = [
              '',
              '    const fixedExactGroupIndex = 336',
              '    const fixedExactCustomers = groups[fixedExactGroupIndex].eligibleCustomerIds',
              '    const thresholdCounts = [3, 1, 1, 0] as const',
              '    const exactCases = [',
              "      { extraOneCostSum: 116, companionCost: 56, partnerCost: 60, pair: null },",
              "      { extraOneCostSum: 117, companionCost: 57, partnerCost: 60, pair: null },",
              "      { extraOneCostSum: 119, companionCost: 59, partnerCost: 60, pair: null },",
              "      { extraOneCostSum: 122, companionCost: 62, partnerCost: 60, pair: null },",
              "      { extraOneCostSum: 123, companionCost: 62, partnerCost: 61, pair: [972, 1184] as const },",
              '    ]',
              '    for (const exactCase of exactCases) {',
              '      const supportCuts: number[][] = []',
              "      let status = 'round-limit'",
              '      let masterSolveMs = 0',
              '      let exactSolveMs = 0',
              '      let exactInfeasibleSupports = 0',
              '      let supportSize: number | null = null',
              '      for (let round = 0; round < 16; round += 1) {',
              '        const requiredExtraOneCostCounts =',
              '          exactCase.companionCost === exactCase.partnerCost',
              '            ? [{ ingredientCost: exactCase.companionCost, count: 2 }]',
              '            : [',
              '                { ingredientCost: exactCase.companionCost, count: 1 },',
              '                { ingredientCost: exactCase.partnerCost, count: 1 },',
              '              ]',
              '        const built = build311ExtraCostSumSupportMaster(',
              '          domain,',
              '          fixedExactGroupIndex,',
              '          exactCase.extraOneCostSum,',
              '          {',
              '            supportCuts,',
              '            includeCustomerFlow: true,',
              '            forcedCustomerIds: fixedExactCustomers,',
              '            requiredExtraOneCostCounts,',
              '            requiredExtraOneGroupIndexes: exactCase.pair ?? [],',
              '          },',
              '        )',
              '        const solved = await solveBounded(built.model, 0.5)',
              '        masterSolveMs += solved.solveMs',
              "        if (solved.status === 'infeasible') {",
              "          status = 'infeasible'",
              '          break',
              '        }',
              "        if (solved.status !== 'optimal' || !solved.namedSolution) {",
              '          status = solved.status',
              '          break',
              '        }',
              '        const support = groups.flatMap((_group, groupIndex) => {',
              "          const raw = solved.namedSolution!.get(`s31su_${groupIndex}`)",
              "          return typeof raw === 'number' && Number.isFinite(raw) && raw > 0.5",
              '            ? [groupIndex]',
              '            : []',
              '        })',
              '        supportSize = support.length',
              '        if (support.length !== 30) {',
              "          throw new Error(`Expected 30 support groups, got ${support.length}`)",
              '        }',
              '        const exact = buildFinalizing30MaskPartitionStage(',
              '          domain,',
              "          new Set<ProductionStepKind>(['juicing', 'seasoning', 'blending']),",
              '          thresholdCounts,',
              '          { max: 76 },',
              '          0,',
              '          new Set(support),',
              '        )',
              '        const exactSolved = await solveBounded(exact.model, 3)',
              '        exactSolveMs += exactSolved.solveMs',
              "        if (exactSolved.status === 'infeasible') {",
              '          exactInfeasibleSupports += 1',
              '          supportCuts.push(support)',
              "          status = 'exact-infeasible-support'",
              '          continue',
              '        }',
              "        if (exactSolved.status === 'optimal') {",
              "          status = 'global-witness'",
              '          break',
              '        }',
              "        status = `exact-${exactSolved.status}`",
              '        break',
              '      }',
              '      console.info(',
              "        '[machine-extra1-pair-exact-cell]',",
              '        JSON.stringify({',
              '          fixedGroupIndex: fixedExactGroupIndex,',
              '          ...exactCase,',
              '          status,',
              '          supportCuts: supportCuts.length,',
              '          exactInfeasibleSupports,',
              '          supportSize,',
              '          masterSolveMs: Math.round(masterSolveMs),',
              '          exactSolveMs: Math.round(exactSolveMs),',
              '        }),',
              '      )',
              '    }',
          ]
          test = test + '\n'.join(exact_lines)
          text = text[:start] + test + text[end:]
          path.write_text(text)
          PY
      - name: Run smallest exact customer-flow pair slice
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t 'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support' 2>&1 | tee identity-336-smallest-exact-pair-slice.log
          grep -F '[machine-extra1-pair-exact-cell]' identity-336-smallest-exact-pair-slice.log | tee identity-336-smallest-exact-pair-cells.log
          test "$(wc -l < identity-336-smallest-exact-pair-cells.log)" -eq 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-336-smallest-exact-pair-slice
          path: |
            identity-336-smallest-exact-pair-slice.log
            identity-336-smallest-exact-pair-cells.log
          if-no-files-found: error
