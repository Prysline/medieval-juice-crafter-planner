name: Identity 334 tacy residual exact binary split
on:
  pull_request:

jobs:
  prepare-tacy-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Ulbert exact and routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11642000936/zip" -o ulbert-exact.zip
          unzip -q ulbert-exact.zip -d ulbert-exact
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11641553480/zip" -o ulbert-routing.zip
          unzip -q ulbert-routing.zip -d ulbert-routing
          gh run download "37983086127" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-ulbert-binary-routing-shard-*' --dir ulbert-routing-shards
          test "$(find ulbert-routing-shards -name routing-results.json | wc -l)" -eq 11
      - name: Build 1204 Tacy binary exact branches from 602 routed parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_tacy.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-tacy-binary-exact-source
          path: identity-334-tacy-binary-exact-source.json
          if-no-files-found: error

  identity-334-tacy-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-tacy-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-tacy-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run up to 20 independent Tacy binary exact branches
        env:
          SHARD_PARENTS: ${{ matrix.parents_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_tacy.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-tacy-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-tacy-binary-exact:
    if: always()
    needs: identity-334-tacy-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: identity-334-tacy-binary-exact-source
          path: tacy-source
      - name: Download all 61 Tacy exact shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-tacy-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 61
      - name: Audit 1204 Tacy binary exact branches
        run: python .github/scripts/diagnosis_branch21_tacy.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-tacy-binary-exact-audit
          path: identity-334-tacy-binary-exact-audit.json
          if-no-files-found: error
