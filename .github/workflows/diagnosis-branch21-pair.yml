name: Identity 334 Gavinus-route Ivo exact binary split
on:
  pull_request:

jobs:
  prepare-ivo-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download completed post-Nicholas residual routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38104396220 --repo Prysline/medieval-juice-crafter-planner --name identity-334-post-nicholas-residual-routing-source --dir post-nicholas-routing-source
          gh run download 38104396220 --repo Prysline/medieval-juice-crafter-planner --name identity-334-post-nicholas-residual-routing-audit --dir post-nicholas-routing-audit
      - name: Build 6948 Ivo binary exact branches from 3474 Gavinus-route parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_ivo.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-ivo-binary-exact-source
          path: identity-334-ivo-binary-exact-source.json
          if-no-files-found: error

  identity-334-ivo-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    needs: prepare-ivo-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-ivo-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Download validated Ivo exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-ivo-binary-exact-source --dir ivo-source
      - name: Select this exact shard's up to 16 Gavinus-route parents
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          source = json.loads(Path('ivo-source/identity-334-ivo-binary-exact-source.json').read_text())
          parents = source['parentBranches']
          assert len(parents) == 3474
          shard = int(os.environ['SHARD_INDEX'])
          assert 1 <= shard <= 218
          chunk = parents[(shard - 1) * 16:shard * 16]
          assert len(chunk) == (2 if shard == 218 else 16)
          print('SHARD_PARENTS=' + json.dumps(chunk, separators=(',', ':')))
          PY
      - name: Run up to 32 independent Ivo binary exact branches
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_ivo.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-ivo-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-ivo-binary-exact:
    if: always() && github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    needs: identity-334-ivo-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Ivo exact source and all 218 shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-ivo-binary-exact-source --dir ivo-source
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-ivo-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 218
      - name: Audit all 6948 Ivo binary exact branches
        run: python .github/scripts/diagnosis_branch21_ivo.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-ivo-binary-exact-audit
          path: identity-334-ivo-binary-exact-audit.json
          if-no-files-found: error
