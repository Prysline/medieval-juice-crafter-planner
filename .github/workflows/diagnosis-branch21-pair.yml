name: Identity 334 charles residual exact binary split
on:
  pull_request:

jobs:
  prepare-charles-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Harry exact and residual routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11604593218/zip" -o harry-exact.zip
          unzip -q harry-exact.zip -d harry-exact
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11605497843/zip" -o harry-routing.zip
          unzip -q harry-routing.zip -d harry-routing
      - name: Build 2584 Charles binary exact branches from 1292 routed parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_charles.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-charles-binary-exact-source
          path: identity-334-charles-binary-exact-source.json
          if-no-files-found: error

  identity-334-charles-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-charles-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-charles-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run up to 20 independent Charles binary exact branches
        env:
          SHARD_PARENTS: ${{ matrix.parents_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_charles.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-charles-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-charles-binary-exact:
    if: always()
    needs: identity-334-charles-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: identity-334-charles-binary-exact-source
          path: charles-source
      - name: Download all 130 Charles exact shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-charles-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 130
      - name: Audit 2584 Charles binary exact branches
        run: python .github/scripts/diagnosis_branch21_charles.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-charles-binary-exact-audit
          path: identity-334-charles-binary-exact-audit.json
          if-no-files-found: error
