name: Identity 334 residual savius branch routing
on:
  pull_request:
jobs:
  identity-334-residual-savius-branch-routing:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - savius-choice: 690
          - savius-choice: 692
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch current-canonical residual branch routing
        env:
          SAVIUS_CHOICE: ${{ matrix.savius-choice }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()
          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('markers not found')
          savius_choice = int(os.environ['SAVIUS_CHOICE'])
          if savius_choice not in (690, 692):
              raise SystemExit(f'unexpected savius choice {savius_choice}')
          test = text[start:end]
          lines = [
              '',
              '    const fixedExactGroupIndex = 334',
              '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
              "    const residualCustomerIds = domain.serviceableCustomerIds.filter((customerId) => !fixedExactCustomerSet.has(customerId) && customerId !== 'savius')",
              '    const requiredPair = [1052, 1070] as const',
              f'    const saviusChoice = {savius_choice}',
              "    expect(groups[saviusChoice].eligibleCustomerIds).toContain('savius')",
              '    const alreadyRequiredUsedGroupIndexes = new Set<number>([fixedExactGroupIndex, ...requiredPair, saviusChoice])',
              '    const candidatesForCustomer = (customerId: string) => groups.flatMap((group, candidateGroupIndex) => {',
              '      if (candidateGroupIndex === fixedExactGroupIndex) return []',
              '      const residualEligible = group.eligibleCustomerIds.filter((eligibleCustomerId) => !fixedExactCustomerSet.has(eligibleCustomerId))',
              '      if (!residualEligible.includes(customerId)) return []',
              '      const normal = residualEligible.length >= 2',
              '      const slack = group.ingredientCost === SLACK_RECIPE_COST && residualEligible.length >= 1',
              '      return normal || slack ? [{ groupIndex: candidateGroupIndex, slackOnly: !normal && slack }] : []',
              '    })',
              '    const sparseCustomers = residualCustomerIds',
              '      .map((customerId) => ({ customerId, candidates: candidatesForCustomer(customerId) }))',
              '      .filter((entry) => entry.candidates.length > 0 && entry.candidates.every((candidate) => !alreadyRequiredUsedGroupIndexes.has(candidate.groupIndex)))',
              '      .sort((left, right) => left.candidates.length - right.candidates.length || left.customerId.localeCompare(right.customerId))',
              '    const sparse = sparseCustomers[0]',
              '    expect(sparse).toBeDefined()',
              '    if (sparse) {',
              "      console.info('[machine-extra1-pair-residual-branch-routing]', JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, extraOneCostSum: 89, companionCost: 53, pair: requiredPair, saviusChoice, sparseCustomer: sparse.customerId, candidateCount: sparse.candidates.length, candidates: sparse.candidates }))",
              '    }',
          ]
          test += '\n'.join(lines)
          path.write_text(text[:start] + test + text[end:])
          PY
      - name: Run current-canonical residual branch routing
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t 'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support' 2>&1 | tee identity-334-residual-branch-routing.log
          grep -F '[machine-extra1-pair-residual-branch-routing]' identity-334-residual-branch-routing.log | tee identity-334-residual-branch-routing-only.log
          test "$(wc -l < identity-334-residual-branch-routing-only.log)" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-residual-branch-routing-${{ matrix.savius-choice }}
          path: |
            identity-334-residual-branch-routing.log
            identity-334-residual-branch-routing-only.log
          if-no-files-found: error
