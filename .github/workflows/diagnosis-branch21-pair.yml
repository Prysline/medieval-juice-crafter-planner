name: Identity 334 tiffany residual exact audit
on:
  pull_request:
jobs:
  audit-identity-334-tiffany-residual-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - name: Download all 126 source artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh api --paginate /repos/Prysline/medieval-juice-crafter-planner/actions/runs/37600058394/artifacts \
            --jq '.artifacts[] | select(.name | test("^identity-334-[0-9]+-[0-9]+-[0-9]+-tiffany-[0-9]+$")) | [.id, .name] | @tsv' \
            > artifact-list.tsv
          test "$(wc -l < artifact-list.tsv)" -eq 126
          while IFS=$'\t' read -r artifact_id artifact_name; do
            mkdir -p "artifacts/$artifact_name"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/$artifact_id/zip" \
              -o artifact.zip
            unzip -q artifact.zip -d "artifacts/$artifact_name"
          done < artifact-list.tsv
      - name: Audit 126 Tiffany exact artifacts
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          ansi = re.compile(r'\x1b\[[0-9;]*m')
          residuals = [
              (8,969,385), (8,969,453), (8,969,455),
              (8,1367,385), (8,1367,453), (8,1367,455),
              (30,969,452), (30,969,453), (30,969,454), (30,969,455),
              (30,995,452), (30,995,453), (30,995,454), (30,995,455),
              (30,1367,385), (30,1367,452), (30,1367,453), (30,1367,455),
          ]
          tiffany_choices = [839, 977, 1101, 1135, 1204, 1210, 1213]
          expected = {(o, l, h, t) for o, l, h in residuals for t in tiffany_choices}
          seen = {}
          malformed = []
          outer_failures = []
          result_missing = []
          statuses = {}
          branches_by_status = {}
          support_cut_branches = []
          exact_attempt_branches = []
          witnesses = []

          for meta_path in Path('artifacts').rglob('identity-334-hugo-tiffany-branch-audit.json'):
              try:
                  meta = json.loads(meta_path.read_text())
                  o, l, h = map(int, meta['branch'].split('-'))
                  t = int(meta['tiffanyChoice'])
                  key = (o, l, h, t)
                  seen.setdefault(key, []).append(str(meta_path))
                  if meta.get('vitestExit') != 0:
                      outer_failures.append({'key': key, 'vitestExit': meta.get('vitestExit')})
                  if meta.get('resultCount') != 1:
                      result_missing.append({'key': key, 'resultCount': meta.get('resultCount')})
                  result_path = meta_path.with_name('identity-334-hugo-tiffany-result.log')
                  lines = [line for line in result_path.read_text().splitlines() if line.strip()] if result_path.exists() else []
                  if len(lines) != 1:
                      continue
                  marker = '[machine-extra1-pair-hugo-tiffany-result] '
                  clean = ansi.sub('', lines[0])
                  marker_index = clean.find(marker)
                  if marker_index < 0:
                      malformed.append({'key': key, 'reason': 'missing-result-marker'})
                      continue
                  result = json.loads(clean[marker_index + len(marker):])
                  emitted_key = (result['octaviusChoice'], result['oliverChoice'], result['hugoChoice'], result['tiffanyChoice'])
                  if emitted_key != key:
                      malformed.append({'key': key, 'reason': 'branch-identity-mismatch', 'emitted': emitted_key})
                      continue
                  status = result['status']
                  statuses[status] = statuses.get(status, 0) + 1
                  branches_by_status.setdefault(status, []).append(key)
                  if result.get('supportCuts', 0) > 0 or result.get('exactInfeasibleSupports', 0) > 0:
                      support_cut_branches.append({'key': key, 'supportCuts': result.get('supportCuts'), 'exactInfeasibleSupports': result.get('exactInfeasibleSupports')})
                  if result.get('exactSolveMs', 0) > 0:
                      exact_attempt_branches.append({'key': key, 'exactSolveMs': result.get('exactSolveMs'), 'status': status})
                  if status == 'global-witness':
                      witnesses.append(key)
              except Exception as error:
                  malformed.append({'path': str(meta_path), 'reason': repr(error)})

          for status in branches_by_status:
              branches_by_status[status] = sorted(branches_by_status[status])
          seen_keys = set(seen)
          missing = sorted(expected - seen_keys)
          unexpected = sorted(seen_keys - expected)
          duplicates = {str(key): paths for key, paths in seen.items() if len(paths) != 1}
          summary = {
              'sourceRunId': 37600058394,
              'sourceHead': 'a7945efd6878bc3237f4d82335f0359ea69a8528',
              'expectedBranches': len(expected),
              'observedBranches': len(seen_keys),
              'missingBranches': missing,
              'unexpectedBranches': unexpected,
              'duplicateBranches': duplicates,
              'malformed': malformed,
              'outerFailures': outer_failures,
              'resultMissing': result_missing,
              'statuses': statuses,
              'branchesByStatus': branches_by_status,
              'supportCutBranches': support_cut_branches,
              'fixedSupportExactAttemptBranches': exact_attempt_branches,
              'witnesses': witnesses,
              'globalWitnessCount': len(witnesses),
              'complete': not missing and not unexpected and not duplicates and not malformed and not outer_failures and not result_missing,
          }
          Path('identity-334-tiffany-audit.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-tiffany-exact-audit
          path: identity-334-tiffany-audit.json
          if-no-files-found: error
