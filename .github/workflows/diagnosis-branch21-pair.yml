name: Identity 334 christina residual exact binary split
on:
  pull_request:

jobs:
  prepare-christina-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Tacy exact and routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 37984707367 --repo Prysline/medieval-juice-crafter-planner --name identity-334-tacy-binary-exact-audit --dir tacy-exact
          gh run download 38014113202 --repo Prysline/medieval-juice-crafter-planner --name identity-334-tacy-binary-routing-audit --dir tacy-routing
          gh run download 38014113202 --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-tacy-binary-routing-shard-*' --dir tacy-routing-shards
          test "$(find tacy-routing-shards -name routing-results.json | wc -l)" -eq 17
      - name: Build 1940 Christina binary exact branches from 970 routed parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_christina.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-christina-binary-exact-source
          path: identity-334-christina-binary-exact-source.json
          if-no-files-found: error

  identity-334-christina-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-christina-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-christina-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run up to 20 independent Christina binary exact branches
        env:
          SHARD_PARENTS: ${{ matrix.parents_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_christina.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-christina-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-christina-binary-exact:
    if: always()
    needs: identity-334-christina-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Christina exact source and all 97 shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-christina-binary-exact-source --dir christina-source
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-christina-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 97
      - name: Audit all 1940 Christina binary exact branches
        run: python .github/scripts/diagnosis_branch21_christina.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-christina-binary-exact-audit
          path: identity-334-christina-binary-exact-audit.json
          if-no-files-found: error
