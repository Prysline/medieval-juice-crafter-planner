name: Identity187 fresh residual sum enumeration

on:
  pull_request:

jobs:
  identity187-list-sums:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: '3-0-required'
            case: '3:0:required'
          - case_id: '14-0-required'
            case: '14:0:required'
          - case_id: '22-0-forbidden'
            case: '22:0:forbidden'
          - case_id: '23-0-forbidden'
            case: '23:0:forbidden'
          - case_id: '28-0-forbidden'
            case: '28:0:forbidden'
          - case_id: '31-0-forbidden'
            case: '31:0:forbidden'
    name: identity187-list-sums (${{ matrix.case_id }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Enumerate fresh canonical cost sums
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_SUMS: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee identity187-list-sums-${{ matrix.case_id }}.log
      - name: Upload fresh cost-sum enumeration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity187-list-sums-${{ matrix.case_id }}
          path: identity187-list-sums-${{ matrix.case_id }}.log
          if-no-files-found: error
