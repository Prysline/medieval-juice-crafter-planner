name: Identity187 sum116 sparse pair refinement

on:
  pull_request:

jobs:
  identity187-sum116-sparse-pair:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only second-identity selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()
          needle = """              const secondIdentityCandidates =\n                remainingExtraOneGroups.filter(\n"""
          replacement = """              const secondIdentityCandidates =\n                remainingExtraOneGroups\n                  .filter(\n                    (candidateGroupIndex) =>\n                      candidateGroupIndex === 1184,\n                  )\n                  .filter(\n"""
          if needle not in text:
              raise SystemExit('second-identity selector insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check
      - name: Refine exact sparse-customer pair
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '9:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '116'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '456'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee identity187-sum116-456-1184-sparse.log
      - name: Upload sparse-pair log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity187-sum116-456-1184-sparse
          path: identity187-sum116-456-1184-sparse.log
          if-no-files-found: error
