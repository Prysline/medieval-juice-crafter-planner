name: Fresh 3+1+1 identity additions exact refinement

on:
  pull_request:

jobs:
  fresh-311-identity:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - '127'
          - '334'
          - '336'
    name: fresh-311-identity (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine fresh current-canonical 3+1+1 identity by companion cost and exact support
        env:
          MACHINE_CONTINUATION_PROFILE: '1'
          MACHINE_CONTINUATION_PARTIAL_GROUPS: '${{ matrix.group }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t "decomposes unresolved 3+1+1 identities by companion-extra cost and support" 2>&1 | tee fresh-311-identity-${{ matrix.group }}.log
      - name: Upload fresh 3+1+1 identity refinement log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-311-identity-${{ matrix.group }}
          path: fresh-311-identity-${{ matrix.group }}.log
          if-no-files-found: error