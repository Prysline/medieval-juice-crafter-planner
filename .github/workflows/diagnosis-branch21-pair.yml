name: Branch26 forbidden109 identity exact

on:
  pull_request:

jobs:
  machine-forced-cost-role-187-branch26-forbidden109-identity:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        identity:
          - 26
          - 44
          - 45
          - 46
          - 145
          - 146
          - 199
          - 200
          - 224
          - 276
          - 399
          - 403
          - 545
          - 546
          - 547
          - 549
          - 571
          - 573
          - 575
          - 600
          - 608
          - 656
          - 671
          - 695
          - 768
          - 769
          - 950
          - 951
          - 953
          - 1040
          - 1044
          - 1056
          - 1083
          - 1090
          - 1091
          - 1102
          - 1188
          - 1189
          - 1193
          - 1212
          - 1213
          - 1257
          - 1284
          - 1294
    name: machine-forced-cost-role-187-branch26-forbidden109-identity (${{ matrix.identity }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only exact pair selectors
        run: python .github/diagnostics/apply-branch20-pair-choice-selectors.py
      - name: Solve branch 26 forbidden sum109 exact first identity
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '26:0:forbidden'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '109'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_COSTS: '54'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '${{ matrix.identity }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch26-forbidden109-identity-${{ matrix.identity }}.log
      - name: Upload branch 26 forbidden109 identity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch26-forbidden109-identity-${{ matrix.identity }}
          path: branch26-forbidden109-identity-${{ matrix.identity }}.log
          if-no-files-found: error
