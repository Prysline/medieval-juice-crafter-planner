name: Identity 334 Daniel residual routing
on:
  pull_request:

jobs:
  prepare-daniel-residual-routing:
    if: github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download completed Daniel binary exact audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38122577800 --repo Prysline/medieval-juice-crafter-planner --name identity-334-daniel-binary-exact-audit --dir daniel-exact
      - name: Build 7724 genuine Daniel residual routing branches
        id: matrix
        run: python .github/scripts/diagnosis_branch21_daniel_routing.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-daniel-residual-routing-source
          path: identity-334-daniel-residual-routing-source.json
          if-no-files-found: error

  identity-334-daniel-residual-routing:
    if: github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    needs: prepare-daniel-residual-routing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-daniel-residual-routing.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Download validated Daniel residual routing source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-daniel-residual-routing-source --dir daniel-routing-source
      - name: Select this routing shard's up to 60 Daniel residual parents
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          source = json.loads(Path('daniel-routing-source/identity-334-daniel-residual-routing-source.json').read_text())
          parents = source['parentBranches']
          assert len(parents) == 7724
          shard = int(os.environ['SHARD_INDEX'])
          assert 1 <= shard <= 129
          chunk = parents[(shard - 1) * 60:shard * 60]
          assert len(chunk) == (44 if shard == 129 else 60)
          print('SHARD_BRANCHES=' + json.dumps(chunk, separators=(',', ':')))
          PY
      - name: Route up to 60 genuine Daniel residual branches
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_daniel_routing.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-daniel-residual-routing-shard-${{ matrix.shard }}
          path: |
            routing-results.json
            branch-*.log
          if-no-files-found: error

  audit-daniel-residual-routing:
    if: always() && github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    needs: identity-334-daniel-residual-routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Daniel exact audit, routing source, and all 129 shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38122577800 --repo Prysline/medieval-juice-crafter-planner --name identity-334-daniel-binary-exact-audit --dir daniel-exact
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-daniel-residual-routing-source --dir daniel-routing-source
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-daniel-residual-routing-shard-*' --dir routing-shards
          test "$(find routing-shards -name routing-results.json | wc -l)" -eq 129
      - name: Audit all 7724 Daniel residual routing branches
        run: python .github/scripts/diagnosis_branch21_daniel_routing.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-daniel-residual-routing-audit
          path: identity-334-daniel-residual-routing-audit.json
          if-no-files-found: error
