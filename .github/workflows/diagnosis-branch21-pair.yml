name: Identity 334 dominic residual branch routing
on:
  pull_request:
jobs:
  prepare-dominic-residual-routing-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build 521 residual routing branches
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11474735976/zip" \
            -o dominic-audit.zip
          unzip -q dominic-audit.zip -d dominic-audit
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          audit = json.loads(Path('dominic-audit/identity-334-dominic-exact-audit.json').read_text())
          assert audit['complete'] is True
          assert audit['expectedBranches'] == 720
          assert audit['observedBranches'] == 720
          assert audit['outerFailures'] == 0
          assert audit['statuses'] == {'infeasible': 199, 'timelimit': 521}
          assert audit['supportCuts'] == 0
          assert audit['exactInfeasibleSupports'] == 0
          assert audit['fixedSupportExactAttempts'] == 0
          assert audit['witnessCount'] == 0
          residuals = audit['branchesByStatus']['timelimit']
          assert len(residuals) == 521
          shards = []
          for shard_index, start in enumerate(range(0, len(residuals), 3), start=1):
              chunk = residuals[start:start + 3]
              shards.append({
                  'shard': shard_index,
                  'branches_json': json.dumps(chunk, separators=(',', ':')),
              })
          assert len(shards) == 174
          assert sum(len(json.loads(shard['branches_json'])) for shard in shards) == 521
          print('matrix=' + json.dumps({'include': shards}, separators=(',', ':')))
          PY

  identity-334-dominic-residual-routing:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-dominic-residual-routing-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-dominic-residual-routing-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Route up to three current-canonical Dominic residual branches
        env:
          SHARD_BRANCHES: ${{ matrix.branches_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          source_path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          base_text = source_path.read_text()
          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = base_text.find(start_marker)
          end = base_text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('markers not found')
          base_test = base_text[start:end]
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          marker = '[machine-extra1-pair-dominic-residual-routing] '
          branches = json.loads(os.environ['SHARD_BRANCHES'])
          assert 1 <= len(branches) <= 3
          shard_results = []
          had_outer_failure = False

          for ordinal, values in enumerate(branches, start=1):
              octavius_choice, oliver_choice, hugo_choice, tiffany_choice, dominic_choice = values
              lines = [
                  '',
                  '    const fixedExactGroupIndex = 334',
                  '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
                  "    const residualCustomerIds = domain.serviceableCustomerIds.filter((customerId) => !fixedExactCustomerSet.has(customerId) && !['savius', 'ambrosia', 'octavius', 'oliver', 'hugo', 'tiffany', 'dominic'].includes(customerId))",
                  '    const requiredPair = [1052, 1070] as const',
                  '    const saviusChoice = 692',
                  '    const ambrosiaChoice = 1243',
                  f'    const octaviusChoice = {octavius_choice}',
                  f'    const oliverChoice = {oliver_choice}',
                  f'    const hugoChoice = {hugo_choice}',
                  f'    const tiffanyChoice = {tiffany_choice}',
                  f'    const dominicChoice = {dominic_choice}',
                  "    expect(groups[saviusChoice].eligibleCustomerIds).toContain('savius')",
                  "    expect(groups[ambrosiaChoice].eligibleCustomerIds).toContain('ambrosia')",
                  "    expect(groups[octaviusChoice].eligibleCustomerIds).toContain('octavius')",
                  "    expect(groups[oliverChoice].eligibleCustomerIds).toContain('oliver')",
                  "    expect(groups[hugoChoice].eligibleCustomerIds).toContain('hugo')",
                  "    expect(groups[tiffanyChoice].eligibleCustomerIds).toContain('tiffany')",
                  "    expect(groups[dominicChoice].eligibleCustomerIds).toContain('dominic')",
                  '    const alreadyRequiredUsedGroupIndexes = new Set<number>([fixedExactGroupIndex, ...requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice, dominicChoice])',
                  '    const candidatesForCustomer = (customerId: string) => groups.flatMap((group, candidateGroupIndex) => {',
                  '      if (candidateGroupIndex === fixedExactGroupIndex) return []',
                  '      const residualEligible = group.eligibleCustomerIds.filter((eligibleCustomerId) => !fixedExactCustomerSet.has(eligibleCustomerId))',
                  '      if (!residualEligible.includes(customerId)) return []',
                  '      const normal = residualEligible.length >= 2',
                  '      const slack = group.ingredientCost === SLACK_RECIPE_COST && residualEligible.length >= 1',
                  '      return normal || slack ? [{ groupIndex: candidateGroupIndex, slackOnly: !normal && slack }] : []',
                  '    })',
                  '    const sparseCustomers = residualCustomerIds',
                  '      .map((customerId) => ({ customerId, candidates: candidatesForCustomer(customerId) }))',
                  '      .filter((entry) => entry.candidates.length > 0 && entry.candidates.every((candidate) => !alreadyRequiredUsedGroupIndexes.has(candidate.groupIndex)))',
                  '      .sort((left, right) => left.candidates.length - right.candidates.length || left.customerId.localeCompare(right.customerId))',
                  '    const sparse = sparseCustomers[0]',
                  '    expect(sparse).toBeDefined()',
                  '    if (sparse) {',
                  "      console.info('[machine-extra1-pair-dominic-residual-routing]', JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, extraOneCostSum: 89, companionCost: 53, pair: requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice, dominicChoice, sparseCustomer: sparse.customerId, candidateCount: sparse.candidates.length, candidates: sparse.candidates }))",
                  '    }',
              ]
              source_path.write_text(base_text[:start] + base_test + '\n'.join(lines) + base_text[end:])
              command = [
                  'npx', 'vitest', 'run',
                  'src/domain/optimizerMachineContinuationProfile.test.ts',
                  '--maxWorkers=1', '--minWorkers=1',
                  '-t', r'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support',
              ]
              try:
                  completed = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=150)
                  output = completed.stdout
                  returncode = completed.returncode
                  outer_timeout = False
              except subprocess.TimeoutExpired as exc:
                  output = (exc.stdout or '') if isinstance(exc.stdout, str) else (exc.stdout or b'').decode(errors='replace')
                  returncode = 124
                  outer_timeout = True
              Path(f'branch-{ordinal}.log').write_text(output)
              clean_lines = [ansi.sub('', line) for line in output.splitlines()]
              marked = [line for line in clean_lines if marker in line]
              result = {
                  'branch': values,
                  'outerReturnCode': returncode,
                  'outerTimeout': outer_timeout,
                  'markerCount': len(marked),
                  'routing': None,
              }
              if len(marked) == 1:
                  marker_index = marked[0].find(marker)
                  result['routing'] = json.loads(marked[0][marker_index + len(marker):])
              if returncode != 0 or len(marked) != 1:
                  had_outer_failure = True
              shard_results.append(result)

          source_path.write_text(base_text)
          Path('routing-results.json').write_text(json.dumps(shard_results, indent=2, sort_keys=True) + '\n')
          if had_outer_failure:
              raise SystemExit('one or more routing branches failed or emitted an invalid result count')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-dominic-routing-shard-${{ matrix.shard }}
          path: |
            routing-results.json
            branch-*.log
          if-no-files-found: error

  audit-dominic-residual-routing:
    if: always()
    needs: identity-334-dominic-residual-routing
    runs-on: ubuntu-latest
    steps:
      - name: Download all routing shard artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-dominic-routing-shard-*' --dir routing-shards
          test "$(find routing-shards -name routing-results.json | wc -l)" -eq 174
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11474735976/zip" \
            -o dominic-audit.zip
          unzip -q dominic-audit.zip -d dominic-audit
      - name: Audit 521 current-canonical routing results
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          results = {}
          malformed = []
          outer_failures = []
          sparse_counts = Counter()
          signature_counts = defaultdict(int)

          files = list(Path('routing-shards').rglob('routing-results.json'))
          if len(files) != 174:
              malformed.append({'reason': 'shard-result-count', 'count': len(files)})
          for path in files:
              entries = json.loads(path.read_text())
              for entry in entries:
                  key = tuple(entry['branch'])
                  if key in results:
                      malformed.append({'key': key, 'reason': 'duplicate'})
                      continue
                  results[key] = entry
                  if entry['outerReturnCode'] != 0 or entry['outerTimeout'] or entry['markerCount'] != 1 or entry['routing'] is None:
                      outer_failures.append(entry)
                      continue
                  routing = entry['routing']
                  sparse_counts[routing['sparseCustomer']] += 1
                  signature_key = json.dumps({
                      'sparseCustomer': routing['sparseCustomer'],
                      'candidates': routing['candidates'],
                  }, sort_keys=True, separators=(',', ':'))
                  signature_counts[signature_key] += 1

          audit = json.loads(Path('dominic-audit/identity-334-dominic-exact-audit.json').read_text())
          expected = {tuple(branch) for branch in audit['branchesByStatus']['timelimit']}
          assert len(expected) == 521
          observed = set(results)
          signatures = []
          for signature_key, count in sorted(signature_counts.items()):
              signature = json.loads(signature_key)
              signature['branchCount'] = count
              signatures.append(signature)
          summary = {
              'expectedBranches': 521,
              'observedBranches': len(observed),
              'missingBranches': sorted(expected - observed),
              'unexpectedBranches': sorted(observed - expected),
              'malformed': malformed,
              'outerFailures': len(outer_failures),
              'sparseCustomerCounts': dict(sorted(sparse_counts.items())),
              'routingSignatures': signatures,
              'complete': observed == expected and not malformed and not outer_failures,
          }
          Path('identity-334-dominic-routing-audit.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['complete'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-dominic-routing-audit
          path: identity-334-dominic-routing-audit.json
          if-no-files-found: error
