name: Identity187 remaining case exact solve

on:
  pull_request:

jobs:
  matrix:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - id: cases
        name: Build canonical remaining-case matrix
        shell: bash
        run: |
          cases="$(node scripts/diagnosis/listIdentity187RemainingCases.mjs)"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.length !== 179) process.exit(1)' "$cases"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  identity187-case-exact:
    needs: matrix
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.matrix.outputs.cases) }}
    name: identity187-case-exact (${{ matrix.case }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Solve full canonical cost-sum domain for one case
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case }}'
        run: |
          set -o pipefail
          safe_case="$(printf '%s' '${{ matrix.case }}' | tr ':' '-')"
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee "identity187-case-${safe_case}.log"
      - name: Upload exact case log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity187-case-${{ strategy.job-index }}
          path: identity187-case-*.log
          if-no-files-found: error
