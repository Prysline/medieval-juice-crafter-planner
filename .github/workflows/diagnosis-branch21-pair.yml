name: Identity187 fresh residual cost-sum proof

on:
  pull_request:

jobs:
  identity187-cost-sum:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '3-14-role0'
            cases: '3:0:required;3:0:forbidden;14:0:required;14:0:forbidden'
          - shard: '22'
            cases: '22:0:forbidden;22:1:required;22:1:forbidden;22:2:required;22:2:forbidden;22:4:forbidden'
          - shard: '23'
            cases: '23:0:forbidden;23:1:required;23:1:forbidden;23:2:required;23:2:forbidden;23:4:forbidden'
          - shard: '24-25'
            cases: '24:0:forbidden;24:1:required;24:1:forbidden;24:2:required;24:4:forbidden;25:0:forbidden;25:1:required;25:1:forbidden;25:2:required;25:4:forbidden'
          - shard: '28-29'
            cases: '28:0:forbidden;28:1:required;28:1:forbidden;28:2:required;28:4:forbidden;29:0:forbidden;29:1:required;29:1:forbidden;29:2:required;29:4:forbidden'
          - shard: '30-31'
            cases: '30:0:forbidden;30:1:required;30:2:required;30:4:forbidden;31:0:forbidden;31:1:required;31:2:required;31:4:forbidden'
    name: identity187-cost-sum (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove fresh identity187 residuals by exact cost sum
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.cases }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee identity187-cost-sum-${{ matrix.shard }}.log
      - name: Upload identity187 cost-sum proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity187-cost-sum-${{ matrix.shard }}
          path: identity187-cost-sum-${{ matrix.shard }}.log
          if-no-files-found: error
