name: Identity 334 nicholas residual routing
on:
  pull_request:

jobs:
  prepare-nicholas-routing-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Nicholas exact final audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38062004689 --repo Prysline/medieval-juice-crafter-planner --name identity-334-nicholas-binary-exact-audit --dir nicholas-exact
      - name: Build 5440 Nicholas residual routing branches
        id: matrix
        run: python .github/scripts/diagnosis_branch21_nicholas_routing.py prepare >> "$GITHUB_OUTPUT"

  identity-334-nicholas-routing:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-nicholas-routing-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-nicholas-routing-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Route up to 60 genuine Nicholas timelimit residual branches
        env:
          SHARD_BRANCHES: ${{ matrix.branches_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_nicholas_routing.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-nicholas-binary-routing-shard-${{ matrix.shard }}
          path: |
            routing-results.json
            branch-*.log
          if-no-files-found: error

  audit-nicholas-routing:
    if: always()
    needs: identity-334-nicholas-routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Nicholas exact final audit and all 91 routing shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38062004689 --repo Prysline/medieval-juice-crafter-planner --name identity-334-nicholas-binary-exact-audit --dir nicholas-exact
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-nicholas-binary-routing-shard-*' --dir routing-shards
          test "$(find routing-shards -name routing-results.json | wc -l)" -eq 91
      - name: Audit all 5440 Nicholas residual routing branches
        run: python .github/scripts/diagnosis_branch21_nicholas_routing.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-nicholas-binary-routing-audit
          path: identity-334-nicholas-binary-routing-audit.json
          if-no-files-found: error
