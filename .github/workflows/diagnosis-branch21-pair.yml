name: Branch33 role audit

on:
  pull_request:

jobs:
  machine-forced-role-187-branch33:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit branch 33 exact role and slack frontier
        env:
          MACHINE_CONTINUATION_FORCED_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_ROLE_BRANCHES: '33'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch33-role-audit.log
      - name: Upload branch 33 role audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch33-role-audit
          path: branch33-role-audit.log
          if-no-files-found: error
