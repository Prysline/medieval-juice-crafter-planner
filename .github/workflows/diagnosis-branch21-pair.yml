name: Identity 334 betsy binary residual branch routing
on:
  pull_request:
jobs:
  prepare-betsy-binary-residual-routing-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build 9325 Betsy binary residual routing branches
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11532240384/zip" \
            -o betsy-audit.zip
          unzip -q betsy-audit.zip -d betsy-audit
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          audit = json.loads(Path('betsy-audit/identity-334-betsy-binary-exact-audit.json').read_text())
          assert audit['complete'] is True
          assert audit['sourceSolomonExactRunId'] == 37662969934
          assert audit['sourceBetsyRoutingRunId'] == 37716342240
          assert audit['splitKind'] == 'required-any-used-binary'
          assert audit['betsyCandidateGroups'] == [180, 258, 418, 489, 497, 536, 541, 547, 552, 554, 564, 576, 595, 619, 623, 632]
          assert audit['betsySubsets'] == [
              [180, 258, 418, 489, 497, 536, 541, 547],
              [552, 554, 564, 576, 595, 619, 623, 632],
          ]
          assert audit['expectedBranches'] == 12118
          assert audit['observedBranches'] == 12118
          assert audit['missingBranches'] == []
          assert audit['unexpectedBranches'] == []
          assert audit['duplicateBranches'] == []
          assert audit['malformed'] == []
          assert audit['outerFailures'] == 0
          assert audit['outerTimeouts'] == 0
          assert audit['statuses'] == {'infeasible': 2793, 'timelimit': 9325}
          assert audit['exactInfeasibleBranches'] == 2793
          assert audit['masterTimeoutBranches'] == 9325
          assert audit['roundLimitBranches'] == 0
          assert audit['fixedSupportTimeoutBranches'] == 0
          assert audit['supportCuts'] == 0
          assert audit['exactInfeasibleSupports'] == 0
          assert audit['fixedSupportExactAttempts'] == 0
          assert audit['exactSolveMs'] == 0
          assert audit['witnessCount'] == 0
          assert audit['globalWitnessCount'] == 0
          assert audit['witnesses'] == []
          residuals = audit['branchesByStatus']['timelimit']
          assert len(residuals) == 9325
          assert all(len(branch) == 8 and branch[-1] in (0, 1) for branch in residuals)

          shards = []
          for shard_index, start in enumerate(range(0, len(residuals), 39), start=1):
              chunk = residuals[start:start + 39]
              shards.append({
                  'shard': shard_index,
                  'branches_json': json.dumps(chunk, separators=(',', ':')),
              })
          assert len(shards) == 240
          assert sum(len(json.loads(shard['branches_json'])) for shard in shards) == 9325
          assert max(len(json.loads(shard['branches_json'])) for shard in shards) <= 39
          print('matrix=' + json.dumps({'include': shards}, separators=(',', ':')))
          PY

  identity-334-betsy-binary-residual-routing:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-betsy-binary-residual-routing-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-betsy-binary-residual-routing-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Route up to thirty-nine current-canonical Betsy binary residual branches
        env:
          SHARD_BRANCHES: ${{ matrix.branches_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          source_path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          base_text = source_path.read_text()
          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = base_text.find(start_marker)
          end = base_text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('markers not found')
          base_test = base_text[start:end]
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          marker = '[machine-extra1-pair-betsy-binary-residual-routing] '
          branches = json.loads(os.environ['SHARD_BRANCHES'])
          assert 1 <= len(branches) <= 39
          betsy_subsets = [
              [180, 258, 418, 489, 497, 536, 541, 547],
              [552, 554, 564, 576, 595, 619, 623, 632],
          ]
          shard_results = []
          had_outer_failure = False

          for ordinal, values in enumerate(branches, start=1):
              if len(values) != 8 or values[-1] not in (0, 1):
                  raise SystemExit(f'invalid Betsy binary residual identity: {values!r}')
              octavius_choice, oliver_choice, hugo_choice, tiffany_choice, dominic_choice, heloise_choice, solomon_choice, betsy_split_index = values
              betsy_subset = betsy_subsets[betsy_split_index]
              subset_literal = json.dumps(betsy_subset, separators=(',', ':'))
              lines = [
                  '',
                  '    const fixedExactGroupIndex = 334',
                  '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
                  "    const residualCustomerIds = domain.serviceableCustomerIds.filter((customerId) => !fixedExactCustomerSet.has(customerId) && !['savius', 'ambrosia', 'octavius', 'oliver', 'hugo', 'tiffany', 'dominic', 'heloise', 'solomon', 'betsy'].includes(customerId))",
                  '    const requiredPair = [1052, 1070] as const',
                  '    const saviusChoice = 692',
                  '    const ambrosiaChoice = 1243',
                  f'    const octaviusChoice = {octavius_choice}',
                  f'    const oliverChoice = {oliver_choice}',
                  f'    const hugoChoice = {hugo_choice}',
                  f'    const tiffanyChoice = {tiffany_choice}',
                  f'    const dominicChoice = {dominic_choice}',
                  f'    const heloiseChoice = {heloise_choice}',
                  f'    const solomonChoice = {solomon_choice}',
                  f'    const betsySplitIndex = {betsy_split_index}',
                  f'    const betsySubset = {subset_literal} as const',
                  "    expect(groups[saviusChoice].eligibleCustomerIds).toContain('savius')",
                  "    expect(groups[ambrosiaChoice].eligibleCustomerIds).toContain('ambrosia')",
                  "    expect(groups[octaviusChoice].eligibleCustomerIds).toContain('octavius')",
                  "    expect(groups[oliverChoice].eligibleCustomerIds).toContain('oliver')",
                  "    expect(groups[hugoChoice].eligibleCustomerIds).toContain('hugo')",
                  "    expect(groups[tiffanyChoice].eligibleCustomerIds).toContain('tiffany')",
                  "    expect(groups[dominicChoice].eligibleCustomerIds).toContain('dominic')",
                  "    expect(groups[heloiseChoice].eligibleCustomerIds).toContain('heloise')",
                  "    expect(groups[solomonChoice].eligibleCustomerIds).toContain('solomon')",
                  "    betsySubset.forEach((groupIndex) => expect(groups[groupIndex].eligibleCustomerIds).toContain('betsy'))",
                  '    const alreadyRequiredUsedGroupIndexes = new Set<number>([fixedExactGroupIndex, ...requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice, dominicChoice, heloiseChoice, solomonChoice])',
                  '    const candidatesForCustomer = (customerId: string) => groups.flatMap((group, candidateGroupIndex) => {',
                  '      if (candidateGroupIndex === fixedExactGroupIndex) return []',
                  '      const residualEligible = group.eligibleCustomerIds.filter((eligibleCustomerId) => !fixedExactCustomerSet.has(eligibleCustomerId))',
                  '      if (!residualEligible.includes(customerId)) return []',
                  '      const normal = residualEligible.length >= 2',
                  '      const slack = group.ingredientCost === SLACK_RECIPE_COST && residualEligible.length >= 1',
                  '      return normal || slack ? [{ groupIndex: candidateGroupIndex, slackOnly: !normal && slack }] : []',
                  '    })',
                  '    const sparseCustomers = residualCustomerIds',
                  '      .map((customerId) => ({ customerId, candidates: candidatesForCustomer(customerId) }))',
                  '      .filter((entry) => entry.candidates.length > 0 && entry.candidates.every((candidate) => !alreadyRequiredUsedGroupIndexes.has(candidate.groupIndex)))',
                  '      .sort((left, right) => left.candidates.length - right.candidates.length || left.customerId.localeCompare(right.customerId))',
                  '    const sparse = sparseCustomers[0]',
                  '    expect(sparse).toBeDefined()',
                  '    if (sparse) {',
                  "      console.info('[machine-extra1-pair-betsy-binary-residual-routing]', JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, extraOneCostSum: 89, companionCost: 53, pair: requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice, dominicChoice, heloiseChoice, solomonChoice, betsySplitIndex, betsySubset, sparseCustomer: sparse.customerId, candidateCount: sparse.candidates.length, candidates: sparse.candidates }))",
                  '    }',
              ]
              source_path.write_text(base_text[:start] + base_test + '\n'.join(lines) + base_text[end:])
              command = [
                  'npx', 'vitest', 'run',
                  'src/domain/optimizerMachineContinuationProfile.test.ts',
                  '--maxWorkers=1', '--minWorkers=1',
                  '-t', r'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support',
              ]
              try:
                  completed = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=150)
                  output = completed.stdout
                  returncode = completed.returncode
                  outer_timeout = False
              except subprocess.TimeoutExpired as exc:
                  output = (exc.stdout or '') if isinstance(exc.stdout, str) else (exc.stdout or b'').decode(errors='replace')
                  returncode = 124
                  outer_timeout = True
              Path(f'branch-{ordinal}.log').write_text(output)
              clean_lines = [ansi.sub('', line) for line in output.splitlines()]
              marked = [line for line in clean_lines if marker in line]
              result = {
                  'branch': values,
                  'betsySubset': betsy_subset,
                  'outerReturnCode': returncode,
                  'outerTimeout': outer_timeout,
                  'markerCount': len(marked),
                  'routing': None,
              }
              if len(marked) == 1:
                  marker_index = marked[0].find(marker)
                  result['routing'] = json.loads(marked[0][marker_index + len(marker):])
              if returncode != 0 or len(marked) != 1:
                  had_outer_failure = True
              shard_results.append(result)

          source_path.write_text(base_text)
          Path('routing-results.json').write_text(json.dumps(shard_results, indent=2, sort_keys=True) + '\n')
          if had_outer_failure:
              raise SystemExit('one or more Betsy binary residual routing branches failed or emitted an invalid result count')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-betsy-binary-routing-shard-${{ matrix.shard }}
          path: |
            routing-results.json
            branch-*.log
          if-no-files-found: error

  audit-betsy-binary-residual-routing:
    if: always()
    needs: identity-334-betsy-binary-residual-routing
    runs-on: ubuntu-latest
    steps:
      - name: Download all 240 Betsy binary routing shard artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-betsy-binary-routing-shard-*' --dir routing-shards
          test "$(find routing-shards -name routing-results.json | wc -l)" -eq 240
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11532240384/zip" \
            -o betsy-audit.zip
          unzip -q betsy-audit.zip -d betsy-audit
      - name: Audit 9325 current-canonical Betsy binary routing results
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          results = {}
          malformed = []
          outer_failures = []
          sparse_counts = Counter()
          signature_counts = defaultdict(int)
          betsy_subsets = [
              [180, 258, 418, 489, 497, 536, 541, 547],
              [552, 554, 564, 576, 595, 619, 623, 632],
          ]

          files = list(Path('routing-shards').rglob('routing-results.json'))
          if len(files) != 240:
              malformed.append({'reason': 'shard-result-count', 'count': len(files)})
          for path in files:
              entries = json.loads(path.read_text())
              if not 1 <= len(entries) <= 39:
                  malformed.append({'path': str(path), 'reason': 'branch-count', 'count': len(entries)})
              for entry in entries:
                  key = tuple(entry.get('branch', []))
                  if len(key) != 8 or key[-1] not in (0, 1):
                      malformed.append({'path': str(path), 'reason': 'branch-identity', 'branch': entry.get('branch')})
                      continue
                  if key in results:
                      malformed.append({'key': list(key), 'reason': 'duplicate'})
                      continue
                  results[key] = entry
                  expected_subset = betsy_subsets[key[-1]]
                  if entry.get('betsySubset') != expected_subset:
                      malformed.append({'key': list(key), 'reason': 'betsy-subset', 'observed': entry.get('betsySubset'), 'expected': expected_subset})
                  if entry.get('outerReturnCode') != 0 or entry.get('outerTimeout') or entry.get('markerCount') != 1 or entry.get('routing') is None:
                      outer_failures.append(entry)
                      continue
                  routing = entry['routing']
                  if routing.get('betsySplitIndex') != key[-1] or routing.get('betsySubset') != expected_subset:
                      malformed.append({'key': list(key), 'reason': 'routing-identity'})
                      continue
                  sparse_counts[routing['sparseCustomer']] += 1
                  signature_key = json.dumps({
                      'betsySplitIndex': key[-1],
                      'sparseCustomer': routing['sparseCustomer'],
                      'candidates': routing['candidates'],
                  }, sort_keys=True, separators=(',', ':'))
                  signature_counts[signature_key] += 1

          audit = json.loads(Path('betsy-audit/identity-334-betsy-binary-exact-audit.json').read_text())
          assert audit['complete'] is True
          assert audit['expectedBranches'] == 12118
          assert audit['observedBranches'] == 12118
          assert audit['statuses'] == {'infeasible': 2793, 'timelimit': 9325}
          expected = {tuple(branch) for branch in audit['branchesByStatus']['timelimit']}
          assert len(expected) == 9325
          observed = set(results)
          signatures = []
          for signature_key, count in sorted(signature_counts.items()):
              signature = json.loads(signature_key)
              signature['branchCount'] = count
              signatures.append(signature)
          summary = {
              'sourceBetsyBinaryExactRunId': 37727009969,
              'sourceBetsyBinaryExactArtifactId': 11532240384,
              'expectedBranches': 9325,
              'observedBranches': len(observed),
              'missingBranches': sorted([list(key) for key in expected - observed]),
              'unexpectedBranches': sorted([list(key) for key in observed - expected]),
              'malformed': malformed,
              'outerFailures': len(outer_failures),
              'sparseCustomerCounts': dict(sorted(sparse_counts.items())),
              'routingSignatures': signatures,
              'complete': observed == expected and not malformed and not outer_failures,
          }
          Path('identity-334-betsy-binary-routing-audit.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['complete'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-betsy-binary-routing-audit
          path: identity-334-betsy-binary-routing-audit.json
          if-no-files-found: error
