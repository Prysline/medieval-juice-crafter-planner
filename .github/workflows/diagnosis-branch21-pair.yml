name: Identity 334 Daniel binary exact
on:
  pull_request:

jobs:
  prepare-daniel-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download completed Ivo residual routing audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38118106345 --repo Prysline/medieval-juice-crafter-planner --name identity-334-ivo-residual-routing-audit --dir ivo-routing-audit
      - name: Build 5051 Daniel binary exact parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_daniel.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-daniel-binary-exact-source
          path: identity-334-daniel-binary-exact-source.json
          if-no-files-found: error

  identity-334-daniel-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    needs: prepare-daniel-binary-exact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-daniel-binary-exact.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Download validated Daniel binary exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-daniel-binary-exact-source --dir daniel-source
      - name: Select this exact shard's up to 20 Daniel parents
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          source = json.loads(Path('daniel-source/identity-334-daniel-binary-exact-source.json').read_text())
          parents = source['parentBranches']
          assert len(parents) == 5051
          shard = int(os.environ['SHARD_INDEX'])
          assert 1 <= shard <= 253
          chunk = parents[(shard - 1) * 20:shard * 20]
          assert len(chunk) == (11 if shard == 253 else 20)
          print('SHARD_PARENTS=' + json.dumps(chunk, separators=(',', ':')))
          PY
      - name: Prove up to 40 Daniel binary exact children
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_daniel.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-daniel-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-daniel-binary-exact:
    if: always() && github.head_ref == 'perf/exact-machine-operation-ivo-continuation'
    needs: identity-334-daniel-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Daniel source and all 253 exact shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-daniel-binary-exact-source --dir daniel-source
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-daniel-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 253
      - name: Audit all 10102 Daniel binary exact children
        run: python .github/scripts/diagnosis_branch21_daniel.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-daniel-binary-exact-audit
          path: identity-334-daniel-binary-exact-audit.json
          if-no-files-found: error
