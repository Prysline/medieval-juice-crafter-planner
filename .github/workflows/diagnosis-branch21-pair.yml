name: Branch27 focused survivor refinement

on:
  pull_request:

jobs:
  machine-forced-cost-role-187-branch27-survivors:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: r0req-115-first46
            case: '27:0:required'
            sum: '115'
            firstIdentity: '46'
            listIdentities: '0'
          - id: r0req-115-first573
            case: '27:0:required'
            sum: '115'
            firstIdentity: '573'
            listIdentities: '0'
          - id: r0req-115-first666
            case: '27:0:required'
            sum: '115'
            firstIdentity: '666'
            listIdentities: '0'
          - id: r0req-115-first1257
            case: '27:0:required'
            sum: '115'
            firstIdentity: '1257'
            listIdentities: '0'
          - id: r0req-115-first1305
            case: '27:0:required'
            sum: '115'
            firstIdentity: '1305'
            listIdentities: '0'
          - id: r0req-120-first1210
            case: '27:0:required'
            sum: '120'
            firstIdentity: '1210'
            listIdentities: '0'
          - id: r0req-99-list
            case: '27:0:required'
            sum: '99'
            firstIdentity: ''
            listIdentities: '1'
          - id: r0forbid-105-list
            case: '27:0:forbidden'
            sum: '105'
            firstIdentity: ''
            listIdentities: '1'
    name: machine-forced-cost-role-187-branch27-survivor (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine branch 27 exact survivor
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '${{ matrix.sum }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '${{ matrix.firstIdentity }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_IDENTITIES: '${{ matrix.listIdentities }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch27-survivor-${{ matrix.id }}.log
      - name: Upload branch 27 survivor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch27-survivor-${{ matrix.id }}
          path: branch27-survivor-${{ matrix.id }}.log
          if-no-files-found: error
