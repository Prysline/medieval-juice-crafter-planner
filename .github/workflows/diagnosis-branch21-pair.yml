name: Identity 334 gonzalo residual routing
on:
  pull_request:

jobs:
  prepare-gonzalo-binary-residual-routing-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Gonzalo binary exact audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11667339782/zip" -o gonzalo-exact.zip
          unzip -q gonzalo-exact.zip -d gonzalo-exact
      - name: Build 3689 Gonzalo binary residual routing branches
        id: matrix
        run: python .github/scripts/diagnosis_branch21_gonzalo_routing.py prepare >> "$GITHUB_OUTPUT"

  identity-334-gonzalo-binary-residual-routing:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-gonzalo-binary-residual-routing-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-gonzalo-binary-residual-routing-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Route up to 60 current-canonical Gonzalo binary residual branches
        env:
          SHARD_BRANCHES: ${{ matrix.branches_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_gonzalo_routing.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-gonzalo-binary-routing-shard-${{ matrix.shard }}
          path: |
            routing-results.json
            branch-*.log
          if-no-files-found: error

  audit-gonzalo-binary-residual-routing:
    if: always()
    needs: identity-334-gonzalo-binary-residual-routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Gonzalo binary exact audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Prysline/medieval-juice-crafter-planner/actions/artifacts/11667339782/zip" -o gonzalo-exact.zip
          unzip -q gonzalo-exact.zip -d gonzalo-exact
      - name: Download all 62 Gonzalo routing shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-gonzalo-binary-routing-shard-*' --dir routing-shards
          test "$(find routing-shards -name routing-results.json | wc -l)" -eq 62
      - name: Audit 3689 Gonzalo binary residual routing branches
        run: python .github/scripts/diagnosis_branch21_gonzalo_routing.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-gonzalo-binary-routing-audit
          path: identity-334-gonzalo-binary-routing-audit.json
          if-no-files-found: error
