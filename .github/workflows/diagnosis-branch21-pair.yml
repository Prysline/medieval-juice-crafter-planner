name: Branch26 sum115 Hugo454 next exact

on:
  pull_request:

jobs:
  machine-forced-cost-role-187-branch26-sum115-hugo454-next:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only exact pair selectors
        run: python .github/diagnostics/apply-branch20-pair-choice-selectors.py
      - name: Solve branch 26 sum115 666+1287 Hugo454 next sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '26:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '115'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '666'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SECOND_IDENTITIES: '1287'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER_CHOICES: '454'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_NEXT_CUSTOMER: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch26-sum115-666-1287-hugo454-next.log
      - name: Upload branch 26 sum115 Hugo454 next log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch26-sum115-666-1287-hugo454-next
          path: branch26-sum115-666-1287-hugo454-next.log
          if-no-files-found: error
