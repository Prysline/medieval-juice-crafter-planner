name: Identity 334 residual savius ambrosia exact split
on:
  pull_request:
jobs:
  identity-334-residual-savius-ambrosia-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - savius-choice: 690
            ambrosia-choice: 102
          - savius-choice: 690
            ambrosia-choice: 1243
          - savius-choice: 690
            ambrosia-choice: 1245
          - savius-choice: 692
            ambrosia-choice: 102
          - savius-choice: 692
            ambrosia-choice: 1243
          - savius-choice: 692
            ambrosia-choice: 1245
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch exhaustive savius ambrosia residual split
        env:
          SAVIUS_CHOICE: ${{ matrix.savius-choice }}
          AMBROSIA_CHOICE: ${{ matrix.ambrosia-choice }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()
          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('markers not found')
          savius_choice = int(os.environ['SAVIUS_CHOICE'])
          ambrosia_choice = int(os.environ['AMBROSIA_CHOICE'])
          if savius_choice not in (690, 692):
              raise SystemExit(f'unexpected savius choice {savius_choice}')
          if ambrosia_choice not in (102, 1243, 1245):
              raise SystemExit(f'unexpected ambrosia choice {ambrosia_choice}')
          test = text[start:end]
          lines = [
              '',
              '    const fixedExactGroupIndex = 334',
              '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
              '    const fixedExactCustomers = [...fixedExactCustomerSet]',
              '    const requiredPair = [1052, 1070] as const',
              f'    const saviusChoice = {savius_choice}',
              f'    const ambrosiaChoice = {ambrosia_choice}',
              "    expect(groups[saviusChoice].eligibleCustomerIds).toContain('savius')",
              "    expect(groups[ambrosiaChoice].eligibleCustomerIds).toContain('ambrosia')",
              '    const thresholdCounts = [3, 1, 1, 0] as const',
              '    const supportCuts: number[][] = []',
              "    let status = 'round-limit'",
              '    let masterSolveMs = 0',
              '    let exactSolveMs = 0',
              '    let exactInfeasibleSupports = 0',
              '    for (let round = 0; round < 16; round += 1) {',
              '      const built = build311ExtraCostSumSupportMaster(domain, fixedExactGroupIndex, 89, {',
              '        supportCuts,',
              '        includeCustomerFlow: true,',
              '        forcedCustomerIds: fixedExactCustomers,',
              '        requiredUsedGroupIndexes: [saviusChoice, ambrosiaChoice],',
              '        requiredExtraOneGroupIndexes: [...requiredPair],',
              '      })',
              '      const solved = await solveBounded(built.model, 0.5)',
              '      masterSolveMs += solved.solveMs',
              "      if (solved.status === 'infeasible') { status = 'infeasible'; break }",
              "      if (solved.status !== 'optimal' || !solved.namedSolution) { status = solved.status; break }",
              '      const support = groups.flatMap((_group, groupIndex) => {',
              "        const raw = solved.namedSolution!.get(`s31su_${groupIndex}`)",
              "        return typeof raw === 'number' && Number.isFinite(raw) && raw > 0.5 ? [groupIndex] : []",
              '      })',
              "      if (support.length !== 30) throw new Error(`Expected 30 support groups, got ${support.length}`)",
              "      const exact = buildFinalizing30MaskPartitionStage(domain, new Set<ProductionStepKind>(['juicing', 'seasoning', 'blending']), thresholdCounts, { max: 76 }, 0, new Set(support))",
              '      const exactSolved = await solveBounded(exact.model, 3)',
              '      exactSolveMs += exactSolved.solveMs',
              "      if (exactSolved.status === 'infeasible') { exactInfeasibleSupports += 1; supportCuts.push(support); status = 'exact-infeasible-support'; continue }",
              "      if (exactSolved.status === 'optimal') { status = 'global-witness'; break }",
              "      status = `exact-${exactSolved.status}`",
              '      break',
              '    }',
              "    console.info('[machine-extra1-pair-residual-savius-ambrosia-result]', JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, extraOneCostSum: 89, companionCost: 53, pair: requiredPair, saviusChoice, ambrosiaChoice, status, supportCuts: supportCuts.length, exactInfeasibleSupports, masterSolveMs: Math.round(masterSolveMs), exactSolveMs: Math.round(exactSolveMs) }))",
          ]
          test += '\n'.join(lines)
          path.write_text(text[:start] + test + text[end:])
          PY
      - name: Run exhaustive savius ambrosia residual split
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t 'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support' 2>&1 | tee identity-334-residual-savius-ambrosia.log
          grep -F '[machine-extra1-pair-residual-savius-ambrosia-result]' identity-334-residual-savius-ambrosia.log | tee identity-334-residual-savius-ambrosia-result.log
          test "$(wc -l < identity-334-residual-savius-ambrosia-result.log)" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-residual-savius-${{ matrix.savius-choice }}-ambrosia-${{ matrix.ambrosia-choice }}
          path: |
            identity-334-residual-savius-ambrosia.log
            identity-334-residual-savius-ambrosia-result.log
          if-no-files-found: error
