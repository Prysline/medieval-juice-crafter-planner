name: Identity 334 hugo residual branch routing
on:
  pull_request:
jobs:
  identity-334-hugo-residual-branch-routing:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - octavius-choice: 8
            oliver-choice: 969
            hugo-choice: 385
          - octavius-choice: 8
            oliver-choice: 969
            hugo-choice: 453
          - octavius-choice: 8
            oliver-choice: 969
            hugo-choice: 455
          - octavius-choice: 8
            oliver-choice: 1367
            hugo-choice: 385
          - octavius-choice: 8
            oliver-choice: 1367
            hugo-choice: 453
          - octavius-choice: 8
            oliver-choice: 1367
            hugo-choice: 455
          - octavius-choice: 30
            oliver-choice: 969
            hugo-choice: 452
          - octavius-choice: 30
            oliver-choice: 969
            hugo-choice: 453
          - octavius-choice: 30
            oliver-choice: 969
            hugo-choice: 454
          - octavius-choice: 30
            oliver-choice: 969
            hugo-choice: 455
          - octavius-choice: 30
            oliver-choice: 995
            hugo-choice: 452
          - octavius-choice: 30
            oliver-choice: 995
            hugo-choice: 453
          - octavius-choice: 30
            oliver-choice: 995
            hugo-choice: 454
          - octavius-choice: 30
            oliver-choice: 995
            hugo-choice: 455
          - octavius-choice: 30
            oliver-choice: 1367
            hugo-choice: 385
          - octavius-choice: 30
            oliver-choice: 1367
            hugo-choice: 452
          - octavius-choice: 30
            oliver-choice: 1367
            hugo-choice: 453
          - octavius-choice: 30
            oliver-choice: 1367
            hugo-choice: 455
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch current-canonical hugo residual routing
        env:
          OCTAVIUS_CHOICE: ${{ matrix.octavius-choice }}
          OLIVER_CHOICE: ${{ matrix.oliver-choice }}
          HUGO_CHOICE: ${{ matrix.hugo-choice }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()
          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('markers not found')
          octavius_choice = int(os.environ['OCTAVIUS_CHOICE'])
          oliver_choice = int(os.environ['OLIVER_CHOICE'])
          hugo_choice = int(os.environ['HUGO_CHOICE'])
          valid = {
              (8, 969, 385), (8, 969, 453), (8, 969, 455),
              (8, 1367, 385), (8, 1367, 453), (8, 1367, 455),
              (30, 969, 452), (30, 969, 453), (30, 969, 454), (30, 969, 455),
              (30, 995, 452), (30, 995, 453), (30, 995, 454), (30, 995, 455),
              (30, 1367, 385), (30, 1367, 452), (30, 1367, 453), (30, 1367, 455),
          }
          if (octavius_choice, oliver_choice, hugo_choice) not in valid:
              raise SystemExit(f'unexpected residual branch {(octavius_choice, oliver_choice, hugo_choice)}')
          test = text[start:end]
          lines = [
              '',
              '    const fixedExactGroupIndex = 334',
              '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
              "    const residualCustomerIds = domain.serviceableCustomerIds.filter((customerId) => !fixedExactCustomerSet.has(customerId) && customerId !== 'savius' && customerId !== 'ambrosia' && customerId !== 'octavius' && customerId !== 'oliver' && customerId !== 'hugo')",
              '    const requiredPair = [1052, 1070] as const',
              '    const saviusChoice = 692',
              '    const ambrosiaChoice = 1243',
              f'    const octaviusChoice = {octavius_choice}',
              f'    const oliverChoice = {oliver_choice}',
              f'    const hugoChoice = {hugo_choice}',
              "    expect(groups[saviusChoice].eligibleCustomerIds).toContain('savius')",
              "    expect(groups[ambrosiaChoice].eligibleCustomerIds).toContain('ambrosia')",
              "    expect(groups[octaviusChoice].eligibleCustomerIds).toContain('octavius')",
              "    expect(groups[oliverChoice].eligibleCustomerIds).toContain('oliver')",
              "    expect(groups[hugoChoice].eligibleCustomerIds).toContain('hugo')",
              '    const alreadyRequiredUsedGroupIndexes = new Set<number>([fixedExactGroupIndex, ...requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice])',
              '    const candidatesForCustomer = (customerId: string) => groups.flatMap((group, candidateGroupIndex) => {',
              '      if (candidateGroupIndex === fixedExactGroupIndex) return []',
              '      const residualEligible = group.eligibleCustomerIds.filter((eligibleCustomerId) => !fixedExactCustomerSet.has(eligibleCustomerId))',
              '      if (!residualEligible.includes(customerId)) return []',
              '      const normal = residualEligible.length >= 2',
              '      const slack = group.ingredientCost === SLACK_RECIPE_COST && residualEligible.length >= 1',
              '      return normal || slack ? [{ groupIndex: candidateGroupIndex, slackOnly: !normal && slack }] : []',
              '    })',
              '    const sparseCustomers = residualCustomerIds',
              '      .map((customerId) => ({ customerId, candidates: candidatesForCustomer(customerId) }))',
              '      .filter((entry) => entry.candidates.length > 0 && entry.candidates.every((candidate) => !alreadyRequiredUsedGroupIndexes.has(candidate.groupIndex)))',
              '      .sort((left, right) => left.candidates.length - right.candidates.length || left.customerId.localeCompare(right.customerId))',
              '    const sparse = sparseCustomers[0]',
              '    expect(sparse).toBeDefined()',
              '    if (sparse) {',
              "      console.info('[machine-extra1-pair-hugo-residual-routing]', JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, extraOneCostSum: 89, companionCost: 53, pair: requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, sparseCustomer: sparse.customerId, candidateCount: sparse.candidates.length, candidates: sparse.candidates }))",
              '    }',
          ]
          test += '\n'.join(lines)
          path.write_text(text[:start] + test + text[end:])
          PY
      - name: Run current-canonical hugo residual routing
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t 'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support' 2>&1 | tee identity-334-hugo-residual-routing.log
          grep -F '[machine-extra1-pair-hugo-residual-routing]' identity-334-hugo-residual-routing.log | tee identity-334-hugo-residual-routing-only.log
          test "$(wc -l < identity-334-hugo-residual-routing-only.log)" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-octavius-${{ matrix.octavius-choice }}-oliver-${{ matrix.oliver-choice }}-hugo-${{ matrix.hugo-choice }}-routing
          path: |
            identity-334-hugo-residual-routing.log
            identity-334-hugo-residual-routing-only.log
          if-no-files-found: error
