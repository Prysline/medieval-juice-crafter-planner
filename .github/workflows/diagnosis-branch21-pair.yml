name: Identity 334 emerys residual exact binary split
on:
  pull_request:

jobs:
  prepare-emerys-binary-shards:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Christina exact and routing evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 38015121516 --repo Prysline/medieval-juice-crafter-planner --name identity-334-christina-binary-exact-audit --dir christina-exact
          gh run download 38028977869 --repo Prysline/medieval-juice-crafter-planner --name identity-334-christina-binary-routing-audit --dir christina-routing
          gh run download 38028977869 --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-christina-binary-routing-shard-*' --dir christina-routing-shards
          test "$(find christina-routing-shards -name routing-results.json | wc -l)" -eq 21
      - name: Build 2414 Emerys binary exact branches from 1207 routed parents
        id: matrix
        run: python .github/scripts/diagnosis_branch21_emerys.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-334-emerys-binary-exact-source
          path: identity-334-emerys-binary-exact-source.json
          if-no-files-found: error

  identity-334-emerys-binary-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    needs: prepare-emerys-binary-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-emerys-binary-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run up to 20 independent Emerys binary exact branches
        env:
          SHARD_PARENTS: ${{ matrix.parents_json }}
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: python .github/scripts/diagnosis_branch21_emerys.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-emerys-binary-exact-shard-${{ matrix.shard }}
          path: |
            exact-results.json
            branch-*.log
          if-no-files-found: error

  audit-emerys-binary-exact:
    if: always()
    needs: identity-334-emerys-binary-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Emerys exact source and all 121 shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --name identity-334-emerys-binary-exact-source --dir emerys-source
          gh run download "$GITHUB_RUN_ID" --repo Prysline/medieval-juice-crafter-planner --pattern 'identity-334-emerys-binary-exact-shard-*' --dir exact-shards
          test "$(find exact-shards -name exact-results.json | wc -l)" -eq 121
      - name: Audit all 2414 Emerys binary exact branches
        run: python .github/scripts/diagnosis_branch21_emerys.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-emerys-binary-exact-audit
          path: identity-334-emerys-binary-exact-audit.json
          if-no-files-found: error
