name: Identity 334 tiffany residual exact split
on:
  pull_request:
jobs:
  identity-334-tiffany-residual-exact:
    if: github.head_ref == 'perf/exact-machine-operation-continuation' && github.event.pull_request.head.sha == 'a7945efd6878bc3237f4d82335f0359ea69a8528'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        residual-branch:
          - '8-969-385'
          - '8-969-453'
          - '8-969-455'
          - '8-1367-385'
          - '8-1367-453'
          - '8-1367-455'
          - '30-969-452'
          - '30-969-453'
          - '30-969-454'
          - '30-969-455'
          - '30-995-452'
          - '30-995-453'
          - '30-995-454'
          - '30-995-455'
          - '30-1367-385'
          - '30-1367-452'
          - '30-1367-453'
          - '30-1367-455'
        tiffany-choice: [839, 977, 1101, 1135, 1204, 1210, 1213]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch exhaustive tiffany residual split
        env:
          RESIDUAL_BRANCH: ${{ matrix.residual-branch }}
          TIFFANY_CHOICE: ${{ matrix.tiffany-choice }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()
          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('markers not found')
          branch = os.environ['RESIDUAL_BRANCH']
          try:
              octavius_choice, oliver_choice, hugo_choice = map(int, branch.split('-'))
          except ValueError as error:
              raise SystemExit(f'invalid residual branch {branch}') from error
          tiffany_choice = int(os.environ['TIFFANY_CHOICE'])
          valid_residual = {
              (8, 969, 385), (8, 969, 453), (8, 969, 455),
              (8, 1367, 385), (8, 1367, 453), (8, 1367, 455),
              (30, 969, 452), (30, 969, 453), (30, 969, 454), (30, 969, 455),
              (30, 995, 452), (30, 995, 453), (30, 995, 454), (30, 995, 455),
              (30, 1367, 385), (30, 1367, 452), (30, 1367, 453), (30, 1367, 455),
          }
          if (octavius_choice, oliver_choice, hugo_choice) not in valid_residual:
              raise SystemExit(f'unexpected residual branch {(octavius_choice, oliver_choice, hugo_choice)}')
          if tiffany_choice not in (839, 977, 1101, 1135, 1204, 1210, 1213):
              raise SystemExit(f'unexpected tiffany choice {tiffany_choice}')
          test = text[start:end]
          lines = [
              '',
              '    const fixedExactGroupIndex = 334',
              '    const fixedExactCustomerSet = new Set(groups[fixedExactGroupIndex].eligibleCustomerIds)',
              '    const fixedExactCustomers = [...fixedExactCustomerSet]',
              '    const requiredPair = [1052, 1070] as const',
              '    const saviusChoice = 692',
              '    const ambrosiaChoice = 1243',
              f'    const octaviusChoice = {octavius_choice}',
              f'    const oliverChoice = {oliver_choice}',
              f'    const hugoChoice = {hugo_choice}',
              f'    const tiffanyChoice = {tiffany_choice}',
              "    expect(groups[saviusChoice].eligibleCustomerIds).toContain('savius')",
              "    expect(groups[ambrosiaChoice].eligibleCustomerIds).toContain('ambrosia')",
              "    expect(groups[octaviusChoice].eligibleCustomerIds).toContain('octavius')",
              "    expect(groups[oliverChoice].eligibleCustomerIds).toContain('oliver')",
              "    expect(groups[hugoChoice].eligibleCustomerIds).toContain('hugo')",
              "    expect(groups[tiffanyChoice].eligibleCustomerIds).toContain('tiffany')",
              '    const thresholdCounts = [3, 1, 1, 0] as const',
              '    const supportCuts: number[][] = []',
              "    let status = 'round-limit'",
              '    let masterSolveMs = 0',
              '    let exactSolveMs = 0',
              '    let exactInfeasibleSupports = 0',
              '    for (let round = 0; round < 16; round += 1) {',
              '      const built = build311ExtraCostSumSupportMaster(domain, fixedExactGroupIndex, 89, {',
              '        supportCuts,',
              '        includeCustomerFlow: true,',
              '        forcedCustomerIds: fixedExactCustomers,',
              '        requiredUsedGroupIndexes: [saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice],',
              '        requiredExtraOneGroupIndexes: [...requiredPair],',
              '      })',
              '      const solved = await solveBounded(built.model, 0.5)',
              '      masterSolveMs += solved.solveMs',
              "      if (solved.status === 'infeasible') { status = 'infeasible'; break }",
              "      if (solved.status !== 'optimal' || !solved.namedSolution) { status = solved.status; break }",
              '      const support = groups.flatMap((_group, groupIndex) => {',
              "        const raw = solved.namedSolution!.get(`s31su_${groupIndex}`)",
              "        return typeof raw === 'number' && Number.isFinite(raw) && raw > 0.5 ? [groupIndex] : []",
              '      })',
              "      if (support.length !== 30) throw new Error(`Expected 30 support groups, got ${support.length}`)",
              "      const exact = buildFinalizing30MaskPartitionStage(domain, new Set<ProductionStepKind>(['juicing', 'seasoning', 'blending']), thresholdCounts, { max: 76 }, 0, new Set(support))",
              '      const exactSolved = await solveBounded(exact.model, 3)',
              '      exactSolveMs += exactSolved.solveMs',
              "      if (exactSolved.status === 'infeasible') { exactInfeasibleSupports += 1; supportCuts.push(support); status = 'exact-infeasible-support'; continue }",
              "      if (exactSolved.status === 'optimal') { status = 'global-witness'; break }",
              "      status = `exact-${exactSolved.status}`",
              '      break',
              '    }',
              "    console.info('[machine-extra1-pair-hugo-tiffany-result]', JSON.stringify({ fixedGroupIndex: fixedExactGroupIndex, extraOneCostSum: 89, companionCost: 53, pair: requiredPair, saviusChoice, ambrosiaChoice, octaviusChoice, oliverChoice, hugoChoice, tiffanyChoice, status, supportCuts: supportCuts.length, exactInfeasibleSupports, masterSolveMs: Math.round(masterSolveMs), exactSolveMs: Math.round(exactSolveMs) }))",
          ]
          test += '\n'.join(lines)
          path.write_text(text[:start] + test + text[end:])
          PY
      - name: Run exhaustive tiffany residual split
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          set +e
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t 'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support' 2>&1 | tee identity-334-hugo-tiffany.log
          vitest_exit=${PIPESTATUS[0]}
          set -e
          grep -F '[machine-extra1-pair-hugo-tiffany-result]' identity-334-hugo-tiffany.log > identity-334-hugo-tiffany-result.log || true
          result_count=$(wc -l < identity-334-hugo-tiffany-result.log)
          printf '{"branch":"%s","tiffanyChoice":%s,"vitestExit":%s,"resultCount":%s}\n' \
            '${{ matrix.residual-branch }}' '${{ matrix.tiffany-choice }}' "$vitest_exit" "$result_count" \
            > identity-334-hugo-tiffany-branch-audit.json
          test "$vitest_exit" -eq 0
          test "$result_count" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-${{ matrix.residual-branch }}-tiffany-${{ matrix.tiffany-choice }}
          path: |
            identity-334-hugo-tiffany.log
            identity-334-hugo-tiffany-result.log
            identity-334-hugo-tiffany-branch-audit.json
          if-no-files-found: error

  audit-identity-334-tiffany-residual-exact:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: identity-334-*-tiffany-*
          path: artifacts
          repository: Prysline/medieval-juice-crafter-planner
          run-id: 37600058394
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit 126 Tiffany exact artifacts
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          ansi = re.compile(r'\x1b\[[0-9;]*m')

          residuals = [
              (8,969,385), (8,969,453), (8,969,455),
              (8,1367,385), (8,1367,453), (8,1367,455),
              (30,969,452), (30,969,453), (30,969,454), (30,969,455),
              (30,995,452), (30,995,453), (30,995,454), (30,995,455),
              (30,1367,385), (30,1367,452), (30,1367,453), (30,1367,455),
          ]
          tiffany_choices = [839, 977, 1101, 1135, 1204, 1210, 1213]
          expected = {(o, l, h, t) for o, l, h in residuals for t in tiffany_choices}
          seen = {}
          malformed = []
          outer_failures = []
          result_missing = []
          statuses = {}
          support_cut_branches = []
          exact_attempt_branches = []
          witnesses = []

          for meta_path in Path('artifacts').rglob('identity-334-hugo-tiffany-branch-audit.json'):
              try:
                  meta = json.loads(meta_path.read_text())
                  o, l, h = map(int, meta['branch'].split('-'))
                  t = int(meta['tiffanyChoice'])
                  key = (o, l, h, t)
                  seen.setdefault(key, []).append(str(meta_path))
                  if meta.get('vitestExit') != 0:
                      outer_failures.append({'key': key, 'vitestExit': meta.get('vitestExit')})
                  if meta.get('resultCount') != 1:
                      result_missing.append({'key': key, 'resultCount': meta.get('resultCount')})
                  result_path = meta_path.with_name('identity-334-hugo-tiffany-result.log')
                  lines = [line for line in result_path.read_text().splitlines() if line.strip()] if result_path.exists() else []
                  if len(lines) != 1:
                      continue
                  marker = '[machine-extra1-pair-hugo-tiffany-result] '
                  clean = ansi.sub('', lines[0])
                  marker_index = clean.find(marker)
                  if marker_index < 0:
                      malformed.append({'key': key, 'reason': 'missing-result-marker'})
                      continue
                  result = json.loads(clean[marker_index + len(marker):])
                  emitted_key = (result['octaviusChoice'], result['oliverChoice'], result['hugoChoice'], result['tiffanyChoice'])
                  if emitted_key != key:
                      malformed.append({'key': key, 'reason': 'branch-identity-mismatch', 'emitted': emitted_key})
                      continue
                  status = result['status']
                  statuses[status] = statuses.get(status, 0) + 1
                  if result.get('supportCuts', 0) > 0 or result.get('exactInfeasibleSupports', 0) > 0:
                      support_cut_branches.append({'key': key, 'supportCuts': result.get('supportCuts'), 'exactInfeasibleSupports': result.get('exactInfeasibleSupports')})
                  if result.get('exactSolveMs', 0) > 0:
                      exact_attempt_branches.append({'key': key, 'exactSolveMs': result.get('exactSolveMs'), 'status': status})
                  if status == 'global-witness':
                      witnesses.append(key)
              except Exception as error:
                  malformed.append({'path': str(meta_path), 'reason': repr(error)})

          seen_keys = set(seen)
          missing = sorted(expected - seen_keys)
          unexpected = sorted(seen_keys - expected)
          duplicates = {str(key): paths for key, paths in seen.items() if len(paths) != 1}
          summary = {
              'sourceRunId': 37600058394,
              'sourceHead': 'a7945efd6878bc3237f4d82335f0359ea69a8528',
              'expectedBranches': len(expected),
              'observedBranches': len(seen_keys),
              'missingBranches': missing,
              'unexpectedBranches': unexpected,
              'duplicateBranches': duplicates,
              'malformed': malformed,
              'outerFailures': outer_failures,
              'resultMissing': result_missing,
              'statuses': statuses,
              'supportCutBranches': support_cut_branches,
              'fixedSupportExactAttemptBranches': exact_attempt_branches,
              'witnesses': witnesses,
              'globalWitnessCount': len(witnesses),
              'complete': not missing and not unexpected and not duplicates and not malformed and not outer_failures and not result_missing,
          }
          Path('identity-334-tiffany-audit.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-tiffany-exact-audit
          path: identity-334-tiffany-audit.json
          if-no-files-found: error
