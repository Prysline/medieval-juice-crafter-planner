name: Identity 334 residual sparse-customer routing
on:
  pull_request:
jobs:
  identity-334-residual-sparse-customer-routing:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch residual sparse-customer routing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/optimizerMachineContinuationProfile.test.ts')
          text = path.read_text()
          start_marker = "hallSignatureProfileIt(\n  'profiles Hall-closure membership signatures for unresolved 3+1+1 support',"
          end_marker = "\n  },\n  120000,\n)\n\n\nfunction build311HallSignatureSupportMaster"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('markers not found')
          test = text[start:end]
          lines = [
              '',
              '    const routingFixedGroupIndex = 334',
              '    const routingPair = [975, 1070] as const',
              '    const routingRequiredGroupIndexes = new Set<number>([routingFixedGroupIndex, ...routingPair])',
              '    const sparseCustomerRoutes = domain.serviceableCustomerIds.flatMap((customerId) => {',
              '      const alreadyCovered = [...routingRequiredGroupIndexes].some((groupIndex) => groups[groupIndex].eligibleCustomerIds.includes(customerId))',
              '      if (alreadyCovered) return []',
              '      const candidates = groups.flatMap((group, groupIndex) =>',
              '        !routingRequiredGroupIndexes.has(groupIndex) && group.eligibleCustomerIds.includes(customerId)',
              '          ? [groupIndex]',
              '          : [],',
              '      )',
              '      return candidates.length > 0 ? [{ customerId, candidateCount: candidates.length, candidates }] : []',
              '    }).sort((left, right) => left.candidateCount - right.candidateCount || left.customerId.localeCompare(right.customerId))',
              "    console.info('[machine-extra1-residual-sparse-customer-routing]', JSON.stringify({ fixedGroupIndex: routingFixedGroupIndex, extraOneCostSum: 94, companionCost: 58, pair: routingPair, routes: sparseCustomerRoutes.slice(0, 20) }))",
              '    expect(sparseCustomerRoutes.length).toBeGreaterThan(0)',
          ]
          test += '\n'.join(lines)
          path.write_text(text[:start] + test + text[end:])
          PY
      - name: Run residual sparse-customer routing
        env:
          MACHINE_CONTINUATION_HALL_SIGNATURE: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 -t 'profiles Hall-closure membership signatures for unresolved 3\+1\+1 support' 2>&1 | tee identity-334-residual-sparse-customer-routing.log
          grep -F '[machine-extra1-residual-sparse-customer-routing]' identity-334-residual-sparse-customer-routing.log | tee identity-334-residual-sparse-customer-routing-only.log
          test "$(wc -l < identity-334-residual-sparse-customer-routing-only.log)" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-334-residual-sparse-customer-routing-94-58-pair-975-1070
          path: |
            identity-334-residual-sparse-customer-routing.log
            identity-334-residual-sparse-customer-routing-only.log
          if-no-files-found: error
