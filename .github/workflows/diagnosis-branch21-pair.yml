name: Branch27 final survivor refinement

on:
  pull_request:

jobs:
  machine-forced-cost-role-187-branch27-final-survivors:
    if: github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: r0req-108-first1090-paircust
            case: '27:0:required'
            sum: '108'
            firstIdentity: '1090'
            firstCost: ''
            listIdentities: '0'
            pairCustomer: '1'
          - id: r0forbid-109-cost54-list
            case: '27:0:forbidden'
            sum: '109'
            firstIdentity: ''
            firstCost: '54'
            listIdentities: '1'
            pairCustomer: '0'
    name: machine-forced-cost-role-187-branch27-final-survivor (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine branch 27 final survivor
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '${{ matrix.sum }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '${{ matrix.firstIdentity }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_COSTS: '${{ matrix.firstCost }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_IDENTITIES: '${{ matrix.listIdentities }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '${{ matrix.pairCustomer }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee branch27-final-survivor-${{ matrix.id }}.log
      - name: Upload branch 27 final survivor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch27-final-survivor-${{ matrix.id }}
          path: branch27-final-survivor-${{ matrix.id }}.log
          if-no-files-found: error
