name: Apply non-cost machine pairwise diagnosis

on:
  push:
    branches:
      - diagnosis/non-cost-machine-certificate
    paths:
      - .github/workflows/apply-non-cost-machine-pairwise.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnosis/non-cost-machine-certificate
          fetch-depth: 0
      - name: Apply pairwise patch
        run: python scripts/apply-non-cost-machine-pairwise.py
      - name: Commit diagnosis source and test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/optimizerHighsSolver.ts src/domain/optimizerPostMaximumCostMachineCertificateProfile.test.ts
          git commit -m 'Debug: test pairwise machine coupling lower bounds'
          git push origin HEAD:diagnosis/non-cost-machine-certificate
