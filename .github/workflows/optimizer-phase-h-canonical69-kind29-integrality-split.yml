name: Optimizer Phase H Canonical-69 Kind29 Integrality Split

on:
  pull_request:
    paths:
      - src/domain/optimizerLbbdCanonical69QuotientPrototype.test.ts
      - .github/workflows/optimizer-phase-h-canonical69-kind29-integrality-split.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [operation-relaxed, production-relaxed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Expose diagnosis-only Phase H model seam
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/optimizerHighsSolver.ts')
          text = path.read_text()
          old = 'function buildHighsStage('
          new = 'export function buildHighsStage('
          if text.count(old) != 1:
              raise SystemExit('buildHighsStage diagnosis seam target not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build exact-safe integrality superset
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/domain/optimizerLbbdCanonical69QuotientPrototype.test.ts')
          text = path.read_text()

          cap_target = "      declaredCap,\n      7,\n"
          if text.count(cap_target) != 1:
              raise SystemExit('Phase H unit-cap patch target not found exactly once')
          text = text.replace(
              cap_target,
              "      declaredCap,\n      5,\n",
              1,
          )

          target = '        model.minimize(positiveKinds)'
          replacement = (
              "        model.addConstraint(\n"
              "          positiveKinds.eq(29),\n"
              "          'q_recipe_kinds_case',\n"
              "        )\n"
              "        model.minimize(positiveKinds)"
          )
          if text.count(target) != 1:
              raise SystemExit('Phase H recipe-kind patch target not found exactly once')
          text = text.replace(target, replacement, 1)

          mode = os.environ['MODE']
          if mode == 'operation-relaxed':
              target = '          const operation = model.intVar('
              if text.count(target) != 1:
                  raise SystemExit('operation relaxation target not found exactly once')
              text = text.replace(
                  target,
                  '          const operation = model.numVar(',
                  1,
              )
          elif mode == 'production-relaxed':
              replacements = [
                  ('          const units = model.intVar(', '          const units = model.numVar('),
                  ('          const normalIdentities = model.intVar(', '          const normalIdentities = model.numVar('),
              ]
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'production relaxation target not found exactly once: {old}')
                  text = text.replace(old, new, 1)
          else:
              raise SystemExit(f'unknown integrality mode: {mode}')

          assertion = "        ).toBe('witness-ready')"
          if text.count(assertion) != 1:
              raise SystemExit('Phase H disposition assertion target not found exactly once')
          text = text.replace(
              assertion,
              "        ).toBe('exact-infeasible-at-102')",
              1,
          )
          path.write_text(text)
          PY
      - name: Prove superset infeasible or reject proof
        env:
          OPTIMIZER_PHASE_H_CANONICAL69_QUOTIENT: '1'
        run: >-
          /usr/bin/time -v
          npx vitest run
          src/domain/optimizerLbbdCanonical69QuotientPrototype.test.ts
          --reporter=verbose
