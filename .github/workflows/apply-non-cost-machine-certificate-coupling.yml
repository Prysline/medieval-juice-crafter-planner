name: Apply non-cost machine certificate coupling diagnosis

on:
  push:
    branches:
      - diagnosis/non-cost-machine-certificate
    paths:
      - .github/workflows/apply-non-cost-machine-certificate-coupling.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnosis/non-cost-machine-certificate
          fetch-depth: 0
      - name: Apply coupling patch
        run: python scripts/apply-non-cost-machine-certificate-coupling.py
      - name: Commit diagnosis source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/optimizerHighsSolver.ts
          git commit -m 'Debug: couple through-seasoning machine lower bound'
          git push origin HEAD:diagnosis/non-cost-machine-certificate
