name: Apply non-cost machine certificate diagnosis

on:
  push:
    branches:
      - diagnosis/non-cost-machine-certificate
    paths:
      - .github/workflows/apply-non-cost-machine-certificate-diagnosis.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnosis/non-cost-machine-certificate
          fetch-depth: 0
      - name: Apply diagnosis slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          solver_path = Path('src/domain/optimizerHighsSolver.ts')
          source = solver_path.read_text()
          marker = 'export interface JarSwitchCertificateSummary {'
          if marker not in source:
              raise SystemExit('optimizerHighsSolver insertion marker not found')
          if 'solvePostMaximumIngredientCostMachineCertificateForDiagnosis' in source:
              raise SystemExit('diagnosis helper already present')

          helper = r'''export interface PostMaximumIngredientCostMachineCertificateDiagnosis {
            prefix: {
              productionUnits: number
              assignedIngredientCost: number
              productionCost: number
            }
            certificate: MachineOperationCertificateSummary | null
          }

          /**
           * Diagnosis-only exact-certificate experiment for the current
           * minimum-waste -> maximum-ingredient-cost -> production-cost prefix.
           *
           * This helper is intentionally NOT wired into highsSolverAdapter.solve.
           * It replays the existing exact prefix stages, then asks whether four
           * independent full-domain machine-operation lower bounds can close
           * against a repaired witness. Every prior lexicographic optimum is
           * fixed during the lower-bound solves, and any candidate certificate
           * still requires a full original-domain fixed-x verification.
           */
          export async function solvePostMaximumIngredientCostMachineCertificateForDiagnosis(
            domain: BatchOptimizationModel,
          ): Promise<PostMaximumIngredientCostMachineCertificateDiagnosis | null> {
            if (!maximumIngredientCostGroupedProductionIsSafe(domain)) {
              return null
            }
            if (
              domain.recipes.some(
                (recipe) => (recipe.initialFinishedServings ?? 0) > 0,
              )
            ) {
              return null
            }

            const fixes: ObjectiveFix[] = []

            const minimumWasteBuilt = buildHighsStage(
              domain,
              'productionUnits',
              [],
              { aggregateEquivalentAssignments: true },
            )
            const minimumWasteSolution = await minimumWasteBuilt.model.solve()
            if (minimumWasteSolution.status !== 'optimal') return null
            const productionUnits = Math.round(
              requiredFiniteNumber(
                minimumWasteSolution.objective,
                'diagnosis minimum-waste objective',
              ),
            )
            fixes.push({ objective: 'productionUnits', value: productionUnits })

            const maximumIngredientCostBuilt = buildHighsStage(
              domain,
              'negativeAssignedIngredientCost',
              fixes,
              {
                aggregateEquivalentMaximumCostAssignments: true,
                aggregateEquivalentMaximumCostProductionUnits: true,
              },
            )
            const maximumIngredientCostSolution =
              await maximumIngredientCostBuilt.model.solve()
            if (maximumIngredientCostSolution.status !== 'optimal') return null
            const negativeAssignedIngredientCost = Math.round(
              requiredFiniteNumber(
                maximumIngredientCostSolution.objective,
                'diagnosis maximum-ingredient-cost objective',
              ),
            )
            fixes.push({
              objective: 'negativeAssignedIngredientCost',
              value: negativeAssignedIngredientCost,
            })

            const productionCost =
              await tryPostMaximumIngredientCostPairParityOptimum(domain, fixes)
            if (productionCost === null) return null
            fixes.push({ objective: 'cost', value: productionCost })

            const prefix = {
              productionUnits,
              assignedIngredientCost: -negativeAssignedIngredientCost,
              productionCost,
            }
            const partitions: Array<{
              key: keyof MachineOperationCertificateSummary['lowerBounds']
              kinds: ProductionStepKind[]
              activeEdgeLowerBound?: boolean
            }> = [
              {
                key: 'throughSeasoning',
                kinds: ['juicing'],
              },
              {
                key: 'throughSeasoning',
                kinds: ['seasoning'],
                activeEdgeLowerBound: true,
              },
              {
                key: 'blending',
                kinds: ['blending'],
              },
              {
                key: 'finalizing',
                kinds: ['finalizing'],
              },
            ]
            const lowerBounds = {
              throughSeasoning: 0,
              blending: 0,
              finalizing: 0,
            }
            const witnessCandidates: RecipeUnitSelection[][] = []

            // Deliberately keep the full current domain for all four partitions
            // in this first non-cost-first experiment. That isolates the proof
            // question from the separate finalizing quotient reduction.
            for (const partition of partitions) {
              const built = buildHighsStage(
                domain,
                'machineOperations',
                fixes,
                {
                  relaxAssignmentVariables: true,
                  aggregateEquivalentMaximumCostAssignments: true,
                  tightenRecipeBoundsFromMinimumCostFix: true,
                  tightenOperationBoundsFromRecipeBounds: true,
                  machineOperationActiveEdgeLowerBound:
                    partition.activeEdgeLowerBound,
                  machineOperationKinds: new Set(partition.kinds),
                },
              )
              const solution = await built.model.solve()
              if (solution.status !== 'optimal') {
                return { prefix, certificate: null }
              }

              lowerBounds[partition.key] += Math.round(
                requiredFiniteNumber(
                  solution.objective,
                  `diagnosis ${partition.key} lower-bound objective`,
                ),
              )
              witnessCandidates.push(
                selectedRecipeUnits(domain, built, solution),
              )
            }

            const lowerBound =
              lowerBounds.throughSeasoning +
              lowerBounds.blending +
              lowerBounds.finalizing

            for (const candidate of witnessCandidates) {
              const repaired = repairMachineOperationWitness(
                domain,
                candidate,
                productionCost,
                lowerBound,
              )
              if (repaired.breakdown.total !== lowerBound) continue

              const fixedRecipeUnits = new Map(
                repaired.selections.map((selection) => [
                  selection.recipeId,
                  selection.units,
                ]),
              )
              const built = buildHighsStage(
                domain,
                'machineOperations',
                fixes,
                { fixedRecipeUnits },
              )
              const solution = await built.model.solve()
              if (solution.status !== 'optimal') continue

              const verifiedObjective = Math.round(
                requiredFiniteNumber(
                  solution.objective,
                  'diagnosis fixed-x machine objective',
                ),
              )
              const assignmentCount = verifiedAssignmentCount(
                domain,
                built,
                solution,
              )
              if (
                verifiedObjective !== lowerBound ||
                assignmentCount !== domain.serviceableCustomerIds.length
              ) {
                continue
              }

              return {
                prefix,
                certificate: {
                  optimum: lowerBound,
                  lowerBounds,
                  witnessRecipeUnits: repaired.selections,
                  witnessRepairSteps: repaired.steps.length,
                  verifiedAssignmentCount: assignmentCount,
                },
              }
            }

            return { prefix, certificate: null }
          }

          '''
          solver_path.write_text(source.replace(marker, helper + marker))

          test = r'''import { Model } from '@bubblyworld/highs-ts'
          import { describe, expect, it } from 'vitest'
          import { customers as canonicalCustomers } from '../data/customers'
          import { customerVillageIsAvailable } from './availability'
          import {
            solvePostMaximumIngredientCostMachineCertificateForDiagnosis,
          } from './optimizerHighsSolver'
          import {
            buildOptimizationModel,
            type BatchOptimizationModel,
            type OptimizationRequest,
          } from './optimizerModel'
          import { buildRecipeCandidatePool } from './recipeCandidatePool'

          declare const process: {
            env: Record<string, string | undefined>
            memoryUsage(): {
              rss: number
              heapTotal: number
              heapUsed: number
              external: number
              arrayBuffers: number
            }
          }

          interface SolveEvent {
            index: number
            solveMs: number
            status: string
            objective: number | null
            lpChars: number
            variables: number
            constraints: number
            memoryBeforeRss: number
            memoryAfterRss: number
          }

          const enabled =
            process.env.OPTIMIZER_POST_MAX_COST_MACHINE_CERTIFICATE_PROFILE === '1'
          const requestedCustomerCount = Number(
            process.env.OPTIMIZER_POST_MAX_COST_MACHINE_CERTIFICATE_CUSTOMERS ?? '12',
          )

          function currentWorldRequest(customerCount: number): OptimizationRequest {
            const currentProgress = 'liquid-blender-unlocked'
            const availableCustomerIds = canonicalCustomers
              .filter((customer) =>
                customerVillageIsAvailable(customer, currentProgress),
              )
              .map((customer) => customer.id)
            const customerIds = availableCustomerIds.slice(0, customerCount)

            return {
              customerIds,
              currentProgress,
              suppliedCustomerIds: [],
              satisfactionByVillage: {
                'east-harbor': 9999,
                'tranquil-fountain': 9999,
                'ibex-statue': 9999,
              },
              formalCustomerIds: customerIds,
              candidatePolicy: 'allow-unambiguous-computed',
              objective: 'minimum-waste',
              priorities: ['minimum-waste', 'maximum-ingredient-cost'],
              availableJuiceJarCount: 5,
            }
          }

          function dimensions(domain: BatchOptimizationModel) {
            const productionEdges = new Set<string>()
            let assignmentEdges = 0
            for (const recipe of domain.recipes) {
              assignmentEdges += recipe.eligibleCustomerIds.length
              for (const edge of recipe.productionPath.edges) {
                productionEdges.add(edge.key)
              }
            }
            return {
              serviceableCustomers: domain.serviceableCustomerIds.length,
              unresolvedCustomers: domain.unresolvedCustomerIds.length,
              recipes: domain.recipes.length,
              assignmentEdges,
              productionEdges: productionEdges.size,
            }
          }

          function installSolveProbe(events: SolveEvent[]): () => void {
            const prototype = Model.prototype as unknown as {
              solve: (
                this: Model,
                ...args: unknown[]
              ) => Promise<{ status: string; objective?: number }>
            }
            const originalSolve = prototype.solve

            prototype.solve = async function (
              this: Model,
              ...args: unknown[]
            ) {
              let lp = ''
              try {
                lp = this.print()
              } catch {
                lp = ''
              }
              const variables = new Set(
                lp.match(
                  /\b(?:x_group|x|y|z|op|pair|single)(?:_[A-Za-z0-9]+)*\b/g,
                ) ?? [],
              )
              const subjectTo =
                lp.match(
                  /Subject To([\s\S]*?)(?:\nBounds|\nGenerals|\nBinaries|\nEnd)/i,
                )?.[1] ?? ''
              const constraints =
                subjectTo.match(/^\s*[A-Za-z0-9_]+:/gm)?.length ?? 0
              const memoryBeforeRss = process.memoryUsage().rss
              const startedAt = performance.now()
              const solution = await originalSolve.apply(this, args)
              const event: SolveEvent = {
                index: events.length + 1,
                solveMs: performance.now() - startedAt,
                status: solution.status,
                objective:
                  typeof solution.objective === 'number' &&
                  Number.isFinite(solution.objective)
                    ? solution.objective
                    : null,
                lpChars: lp.length,
                variables: variables.size,
                constraints,
                memoryBeforeRss,
                memoryAfterRss: process.memoryUsage().rss,
              }
              events.push(event)
              console.info(
                '[post-max-cost-machine-certificate-stage]',
                JSON.stringify(event),
              )
              return solution
            }

            return () => {
              prototype.solve = originalSolve
            }
          }

          const expectedByRequestedCustomers = new Map([
            [
              12,
              {
                prefix: {
                  productionUnits: 6,
                  assignedIngredientCost: 678,
                  productionCost: 339,
                },
                machineOperations: 24,
              },
            ],
            [
              32,
              {
                prefix: {
                  productionUnits: 16,
                  assignedIngredientCost: 1798,
                  productionCost: 899,
                },
                machineOperations: 55,
              },
            ],
          ])

          describe.skipIf(!enabled)(
            'post-maximum-ingredient-cost machine certificate diagnosis',
            () => {
              it(
                `profiles canonical current-world ${requestedCustomerCount}-customer slice`,
                async () => {
                  const request = currentWorldRequest(requestedCustomerCount)
                  const candidatePool = buildRecipeCandidatePool(
                    request.currentProgress,
                  )
                  const domain = buildOptimizationModel(request, {
                    customers: canonicalCustomers,
                    candidatePool,
                  })
                  const events: SolveEvent[] = []
                  const restore = installSolveProbe(events)
                  const startedAt = performance.now()
                  let diagnosis
                  try {
                    diagnosis =
                      await solvePostMaximumIngredientCostMachineCertificateForDiagnosis(
                        domain,
                      )
                  } finally {
                    restore()
                  }
                  const wallMs = performance.now() - startedAt

                  console.info(
                    '[post-max-cost-machine-certificate-summary]',
                    JSON.stringify({
                      requestedCustomers: requestedCustomerCount,
                      dimensions: dimensions(domain),
                      wallMs,
                      diagnosis,
                      solveEvents: events,
                      memoryAfter: process.memoryUsage(),
                    }),
                  )

                  expect(diagnosis).not.toBeNull()
                  const expected =
                    expectedByRequestedCustomers.get(requestedCustomerCount)
                  if (expected) {
                    expect(diagnosis!.prefix).toEqual(expected.prefix)
                    expect(diagnosis!.certificate).not.toBeNull()
                    expect(diagnosis!.certificate!.optimum).toBe(
                      expected.machineOperations,
                    )
                  }
                  if (diagnosis?.certificate) {
                    expect(
                      diagnosis.certificate.verifiedAssignmentCount,
                    ).toBe(domain.serviceableCustomerIds.length)
                  }
                },
                1_200_000,
              )
            },
          )
          '''
          Path('src/domain/optimizerPostMaximumCostMachineCertificateProfile.test.ts').write_text(test)

          workflow = r'''name: Optimizer Non-Cost Machine Certificate Diagnosis

          on:
            pull_request:
              branches:
                - main
              paths:
                - src/domain/optimizerHighsSolver.ts
                - src/domain/optimizerPostMaximumCostMachineCertificateProfile.test.ts
                - .github/workflows/optimizer-non-cost-machine-certificate-diagnosis.yml
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            diagnose:
              strategy:
                fail-fast: false
                matrix:
                  customers: [12, 32]
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install
                - name: Run non-cost machine certificate diagnosis
                  env:
                    OPTIMIZER_POST_MAX_COST_MACHINE_CERTIFICATE_PROFILE: '1'
                    OPTIMIZER_POST_MAX_COST_MACHINE_CERTIFICATE_CUSTOMERS: ${{ matrix.customers }}
                  run: >-
                    npx vitest run
                    src/domain/optimizerPostMaximumCostMachineCertificateProfile.test.ts
                    --reporter=verbose
          '''
          Path('.github/workflows/optimizer-non-cost-machine-certificate-diagnosis.yml').write_text(workflow)
          Path('.github/workflows/apply-non-cost-machine-certificate-diagnosis.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/optimizerHighsSolver.ts \
            src/domain/optimizerPostMaximumCostMachineCertificateProfile.test.ts \
            .github/workflows/optimizer-non-cost-machine-certificate-diagnosis.yml \
            .github/workflows/apply-non-cost-machine-certificate-diagnosis.yml
          git commit -m 'Debug: test non-cost machine certificate decomposition'
          git push origin HEAD:diagnosis/non-cost-machine-certificate
