name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-307:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: b2-r1-req
            cases: '2:1:required'
          - shard: b2-r1-forb
            cases: '2:1:forbidden'
          - shard: b2-r2-forb
            cases: '2:2:forbidden'
          - shard: b2-r4-forb
            cases: '2:4:forbidden'
          - shard: b2-r8-forb
            cases: '2:8:forbidden'
          - shard: b3-r1-req
            cases: '3:1:required'
          - shard: b3-r1-forb
            cases: '3:1:forbidden'
          - shard: b3-r2-req
            cases: '3:2:required'
          - shard: b3-r2-forb
            cases: '3:2:forbidden'
          - shard: b3-r4-forb
            cases: '3:4:forbidden'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Exact identity 307 branch 2/3 cost-role shard
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '307'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: ${{ matrix.cases }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
