name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-223:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: '3'
            cases: '3:1:required;3:1:forbidden;3:2:required;3:2:forbidden;3:4:forbidden'
          - branch: '9'
            cases: '9:1:required;9:1:forbidden;9:2:required;9:2:forbidden;9:4:forbidden'
          - branch: '20'
            cases: '20:0:forbidden;20:1:required;20:1:forbidden;20:2:required;20:2:forbidden;20:4:forbidden;20:8:required;20:8:forbidden'
          - branch: '21'
            cases: '21:1:required;21:1:forbidden;21:2:required;21:2:forbidden;21:4:forbidden'
          - branch: '27'
            cases: '27:1:required;27:1:forbidden;27:2:required;27:2:forbidden;27:4:forbidden'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Close identity 223 branch ${{ matrix.branch }} exact cost buckets
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '223'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: ${{ matrix.cases }}
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
