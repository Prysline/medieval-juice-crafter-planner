  machine-forced-cost-role-187-branch21-r4:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch21-r4 (forbidden-${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '01'
            sums: '52,53,59,62,63,64'
          - shard: '02'
            sums: '65,66,67,68,69,70'
          - shard: '03'
            sums: '71,72,73,74,75,76'
          - shard: '04'
            sums: '77,78,79,80,81,82'
          - shard: '05'
            sums: '83,84,85,86,87,88'
          - shard: '06'
            sums: '89,90,91,92,93,94'
          - shard: '07'
            sums: '95,96,97,98,99,100'
          - shard: '08'
            sums: '101,102,103,104,105'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
