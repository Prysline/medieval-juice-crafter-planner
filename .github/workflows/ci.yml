          - shard: '02'
            sums: '80,81,82,83,84,85'
          - shard: '03'
            sums: '86,87,88,89,90,91'
          - shard: '04'
            sums: '92,93,94,95,96,97'
          - shard: '05'
            sums: '98,99,100,101,102,103'
          - shard: '06'
            sums: '104,105,106,107,108,109'
          - shard: '07'
            sums: '110,111,112,113,114,115'
          - shard: '08'
