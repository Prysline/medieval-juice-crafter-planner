name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-fifth-187-small-tail:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-fifth-187-small-tail (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            cases: '38:3:5:5:0,38:3:5:5:4,38:3:5:5:7,51:1:1:1:7,51:1:1:5:4,51:1:3:5:4,51:1:3:5:6,51:1:4:5:4,51:1:4:5:6,51:2:1:2:0'
          - shard: b
            cases: '51:2:1:2:4,51:2:1:5:4,51:2:3:5:4,51:2:3:5:6,51:2:3:6:7,51:2:4:0:1,51:2:4:1:7,51:2:4:5:0,51:2:4:5:4,51:2:5:5:4'
          - shard: c
            cases: '51:3:1:5:1,51:3:1:5:2,51:3:1:5:4,51:3:3:5:4,51:3:3:5:6,51:3:4:5:2,51:3:4:5:4,51:3:5:5:4,51:3:5:5:6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Close identity 187 small fourth-level tails by Dominic fifth-level cases
        env:
          MACHINE_CONTINUATION_FORCED_FIFTH_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_FIFTH_CASES: '${{ matrix.cases }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-fifth-187-${{ matrix.shard }}.log
      - name: Upload identity 187 fifth-level diagnosis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-fifth-187-${{ matrix.shard }}
          path: machine-forced-fifth-187-${{ matrix.shard }}.log
          if-no-files-found: error
