name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-role-223:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-role-223 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: role-01
            branches: '0,1,2,3,4,5,7,8,9'
          - shard: role-02
            branches: '10,11,12,13,14,15,16,17,18'
          - shard: role-03
            branches: '19,20,21,22,23,24,25,26,27'
          - shard: role-04
            branches: '29,32,33,35,37,38,39,41,43'
          - shard: role-05
            branches: '44,45,47,48,49,50,51,52,53'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Split forced identity 223 by extra-one role and slack
        env:
          MACHINE_CONTINUATION_FORCED_ROLE_GROUP: '223'
          MACHINE_CONTINUATION_FORCED_ROLE_BRANCHES: ${{ matrix.branches }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
