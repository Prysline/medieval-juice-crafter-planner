name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like


  machine-1279-patricia:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-1279-patricia (${{ matrix.slice.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          - { name: a, branches: '0,1,2' }
          - { name: b, branches: '3,4,5' }
          - { name: c, branches: '6,7,8' }
          - { name: d, branches: '9,10,11' }
          - { name: e, branches: '12,13,14' }
          - { name: f, branches: '15,16,17' }
          - { name: g, branches: '18,19,20' }
          - { name: h, branches: '21,22,23' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove sharded identity 1279 frontier
        env:
          MACHINE_CONTINUATION_1279_BASE_BRANCHES: ${{ matrix.slice.branches }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
