name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-role-187-frontier:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe identity 187 base branches by extra-one role and slack
        env:
          MACHINE_CONTINUATION_FORCED_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_ROLE_BRANCHES: '20,21,26,27,32,33,38'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-role-187.log
      - name: Upload identity 187 role/slack diagnosis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-role-187
          path: machine-forced-role-187.log
          if-no-files-found: error
