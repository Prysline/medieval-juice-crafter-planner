name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-666:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-666 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: branch-20-sum-119-first-1287
            cases: '20:0:required'
            sums: '119'
            first: '1287'
          - shard: branch-20-sum-117-first-43
            cases: '20:0:required'
            sums: '117'
            first: '43'
          - shard: branch-20-sum-117-first-141
            cases: '20:0:required'
            sums: '117'
            first: '141'
          - shard: branch-20-sum-117-first-182
            cases: '20:0:required'
            sums: '117'
            first: '182'
          - shard: branch-20-sum-117-first-185
            cases: '20:0:required'
            sums: '117'
            first: '185'
          - shard: branch-20-sum-117-first-187
            cases: '20:0:required'
            sums: '117'
            first: '187'
          - shard: branch-20-sum-117-first-189
            cases: '20:0:required'
            sums: '117'
            first: '189'
          - shard: branch-20-sum-117-first-1032
            cases: '20:0:required'
            sums: '117'
            first: '1032'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Split forced identity 666 fixed extra-one pairs by sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '666'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: ${{ matrix.cases }}
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: ${{ matrix.sums }}
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: ${{ matrix.first }}
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
