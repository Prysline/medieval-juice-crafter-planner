name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-187-branch20-hugo-choice:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch20-hugo-choice (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: second1184-choice452
            secondIdentity: '1184'
            customerChoice: '452'
          - id: second1184-choice453
            secondIdentity: '1184'
            customerChoice: '453'
          - id: second1208-choice453
            secondIdentity: '1208'
            customerChoice: '453'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only branch 20 selectors
        run: python .github/diagnostics/apply-branch20-pair-choice-selectors.py
      - name: Solve identity 187 branch 20 Hugo choice survivor
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '20:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '120'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '1210'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SECOND_IDENTITIES: '${{ matrix.secondIdentity }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER_CHOICES: '${{ matrix.customerChoice }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-cost-role-187-branch20-hugo-choice-${{ matrix.id }}.log
      - name: Upload identity 187 branch 20 Hugo choice log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-cost-role-187-branch20-hugo-choice-${{ matrix.id }}
          path: machine-forced-cost-role-187-branch20-hugo-choice-${{ matrix.id }}.log
          if-no-files-found: error
