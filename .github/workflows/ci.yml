name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-187-branch21-r0:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch21-r0 (${{ matrix.slackCase }}-${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slackCase: [required, forbidden]
        include:
          - shard: '01'
            sums: '19,25,26,28,29,30'
          - shard: '02'
            sums: '31,32,33,34,35,36'
          - shard: '03'
            sums: '37,38,39,40,41,42'
          - shard: '04'
            sums: '43,44,45,46,47,48'
          - shard: '05'
            sums: '49,50,51,52,53,54'
          - shard: '06'
            sums: '55,56,57,58,59,60'
          - shard: '07'
            sums: '61,62,63,64,65,66'
          - shard: '08'
            sums: '67,68,69,70,71,72'
          - shard: '09'
            sums: '73,74,75,76,77,78'
          - shard: '10'
            sums: '79,80,81,82,83,84'
          - shard: '11'
            sums: '85,86,87,88,89,90'
          - shard: '12'
            sums: '91,92,93,94,95,96'
          - shard: '13'
            sums: '97,98,99,100,101,102'
          - shard: '14'
            sums: '103,104,105,106,107,108'
          - shard: '15'
            sums: '109,110,111,112,113,114'
          - shard: '16'
            sums: '115,116,117,118,119,120'
          - shard: '17'
            sums: '121,122,123,124'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Solve identity 187 branch 21 roleMask0 cost-sum shard
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '21:0:${{ matrix.slackCase }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '${{ matrix.sums }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-cost-role-187-branch21-r0-${{ matrix.slackCase }}-${{ matrix.shard }}.log
      - name: Upload identity 187 branch 21 roleMask0 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-cost-role-187-branch21-r0-${{ matrix.slackCase }}-${{ matrix.shard }}
          path: machine-forced-cost-role-187-branch21-r0-${{ matrix.slackCase }}-${{ matrix.shard }}.log
          if-no-files-found: error

