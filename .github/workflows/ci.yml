name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-third-187:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-third-187 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            cases: '20:0:0,20:0:3,20:1:1,20:1:2,20:1:3,20:1:4,20:1:5,20:2:0,20:2:1,20:2:2'
          - shard: b
            cases: '20:2:3,20:2:4,20:2:5,20:3:1,20:3:2,20:3:3,20:3:4,20:3:5,20:4:1,20:4:2'
          - shard: c
            cases: '20:4:3,20:4:4,20:4:5,21:0:3,21:1:1,21:1:2,21:1:3,21:1:4,21:1:5,21:2:1'
          - shard: d
            cases: '21:2:2,21:2:3,21:2:4,21:2:5,21:3:1,21:3:2,21:3:3,21:3:4,21:3:5,21:4:1'
          - shard: e
            cases: '21:4:2,21:4:3,21:4:4,21:4:5,26:0:0,26:0:1,26:0:3,26:1:1,26:1:2,26:1:3'
          - shard: f
            cases: '26:1:4,26:1:5,26:2:1,26:2:2,26:2:3,26:2:4,26:2:5,26:3:1,26:3:2,26:3:3'
          - shard: g
            cases: '26:3:4,26:3:5,26:4:1,26:4:2,26:4:3,26:4:4,26:4:5,27:0:3,27:1:1,27:1:2'
          - shard: h
            cases: '27:1:3,27:1:4,27:1:5,27:2:1,27:2:2,27:2:3,27:2:4,27:2:5,27:3:1,27:3:2'
          - shard: i
            cases: '27:3:3,27:3:4,27:3:5,27:4:1,27:4:2,27:4:3,27:4:4,27:4:5,32:0:0,32:0:3'
          - shard: j
            cases: '32:1:1,32:1:2,32:1:3,32:1:4,32:1:5,32:2:1,32:2:2,32:2:3,32:2:4,32:2:5'
          - shard: k
            cases: '32:3:1,32:3:2,32:3:3,32:3:4,32:3:5,32:4:1,32:4:2,32:4:3,32:4:4,32:4:5'
          - shard: l
            cases: '33:1:1,33:1:2,33:1:3,33:1:4,33:1:5,33:2:1,33:2:2,33:2:3,33:2:4,33:2:5'
          - shard: m
            cases: '33:3:1,33:3:2,33:3:3,33:3:4,33:3:5,33:4:1,33:4:2,33:4:3,33:4:4,33:4:5'
          - shard: n
            cases: '34:0:0,34:1:3,34:4:4,38:1:1,38:1:3,38:1:5,38:2:3,38:2:4,38:3:1,38:3:3'
          - shard: o
            cases: '38:3:4,38:3:5,51:0:0,51:1:1,51:1:3,51:1:4,51:1:5,51:2:0,51:2:1,51:2:3'
          - shard: p
            cases: '51:2:4,51:2:5,51:3:1,51:3:3,51:3:4,51:3:5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine identity 187 by Tiffany third-level cases
        env:
          MACHINE_CONTINUATION_FORCED_THIRD_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_THIRD_CASES: '${{ matrix.cases }}'
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
