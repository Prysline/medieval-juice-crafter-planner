name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-187-branch20-sum106-first1087-second43-sparse:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch20-sum106-first1087-second43-sparse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only branch 20 selectors
        run: python .github/diagnostics/apply-branch20-pair-choice-selectors.py
      - name: Split identity 187 branch 20 sum106 survivor by sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '20:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '106'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_COSTS: '50'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '1087'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SECOND_IDENTITIES: '43'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-cost-role-187-branch20-sum106-first1087-second43-sparse.log
      - name: Upload identity 187 branch 20 sum106 sparse-customer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-cost-role-187-branch20-sum106-first1087-second43-sparse
          path: machine-forced-cost-role-187-branch20-sum106-first1087-second43-sparse.log
          if-no-files-found: error
