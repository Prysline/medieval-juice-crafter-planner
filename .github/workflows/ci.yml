name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-666:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-666 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: branch-20-sum-104
            cases: '20:0:required'
            sums: '104'
          - shard: branch-20-sum-106
            cases: '20:0:required'
            sums: '106'
          - shard: branch-20-sum-107
            cases: '20:0:required'
            sums: '107'
          - shard: branch-20-sum-108
            cases: '20:0:required'
            sums: '108'
          - shard: branch-20-sum-111
            cases: '20:0:required'
            sums: '111'
          - shard: branch-20-sum-114
            cases: '20:0:required'
            sums: '114'
          - shard: branch-20-sum-115
            cases: '20:0:required'
            sums: '115'
          - shard: branch-20-sum-117
            cases: '20:0:required'
            sums: '117'
          - shard: branch-20-sum-118
            cases: '20:0:required'
            sums: '118'
          - shard: branch-20-sum-119
            cases: '20:0:required'
            sums: '119'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Split forced identity 666 by exact extra-one cost
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '666'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: ${{ matrix.cases }}
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: ${{ matrix.sums }}
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: ${{ matrix.first || '-1' }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
