name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-187-branch21-identity-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch21-identity-audit (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: forbidden94, slackCase: forbidden, sum: '94' }
          - { id: forbidden96, slackCase: forbidden, sum: '96' }
          - { id: required98, slackCase: required, sum: '98' }
          - { id: required100, slackCase: required, sum: '100' }
          - { id: required105, slackCase: required, sum: '105' }
          - { id: required107, slackCase: required, sum: '107' }
          - { id: required108, slackCase: required, sum: '108' }
          - { id: required110, slackCase: required, sum: '110' }
          - { id: required112, slackCase: required, sum: '112' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit identity 187 branch 21 first-identity costs
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '21:0:${{ matrix.slackCase }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '${{ matrix.sum }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_IDENTITIES: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-cost-role-187-branch21-identity-audit-${{ matrix.id }}.log
      - name: Upload identity 187 branch 21 identity-audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-cost-role-187-branch21-identity-audit-${{ matrix.id }}
          path: machine-forced-cost-role-187-branch21-identity-audit-${{ matrix.id }}.log
          if-no-files-found: error
