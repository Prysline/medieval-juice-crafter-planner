name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-deep-187:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-deep-187 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            branches: '0,1,2,3,4,8'
          - shard: b
            branches: '9,14,15,18,19,20'
          - shard: c
            branches: '21,22,23,24,25,26'
          - shard: d
            branches: '27,28,29,30,31,32'
          - shard: e
            branches: '33,34,35,36,38'
          - shard: f
            branches: '39,44,45,50,51'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine identity 187 unresolved base branches by next sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_DEEP_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_DEEP_BRANCHES: '${{ matrix.branches }}'
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
