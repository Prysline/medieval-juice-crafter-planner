name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-eighth-187-small-tail:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine identity 187 remaining small tails by eighth-level cases
        env:
          MACHINE_CONTINUATION_FORCED_EIGHTH_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_EIGHTH_CASES: '38:3:5:5:0:0:0:0,38:3:5:5:4:5:2:2,51:1:3:5:4:5:3:0,51:1:3:5:4:5:3:3,51:1:3:5:4:5:3:5,51:1:3:5:4:5:3:9,51:1:3:5:4:5:4:3,51:1:3:5:4:5:4:11,51:1:3:5:4:5:5:3,51:1:3:5:4:6:2:3,51:1:3:5:4:6:2:11'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-eighth-187.log
      - name: Upload identity 187 eighth-level diagnosis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-eighth-187
          path: machine-forced-eighth-187.log
          if-no-files-found: error
