name: CI

on:
  push:
    branches: [main, dev/optimizer-72-runtime]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  optimizer-computed-structure-profile:
    if: github.ref == 'refs/heads/dev/optimizer-72-runtime' || (github.event_name == 'pull_request' && github.base_ref == 'dev/optimizer-72-runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Profile current canonical trusted vs computed model structure (not a solve benchmark)
        env:
          OPTIMIZER_PERF_PROFILE: '1'
        run: npx vitest run src/domain/optimizerPerformanceProfile.test.ts --reporter=verbose
      - name: Audit canonical 72-selected operation bounds without a solver run
        env:
          OPTIMIZER_DEV_72_STRUCTURE: '1'
        run: npx vitest run src/domain/optimizerDevOperationBoundAudit.test.ts -t "profiles the 72-selected proxy machine edge upper bounds without solving" --reporter=verbose

  optimizer-dev-build-runtime:
    # Independent of the timing-sensitive UI regression in the general verify job.
    if: github.ref == 'refs/heads/dev/optimizer-72-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run smoke:highs:dev
      - run: npm run smoke:highs:pages-like

  optimizer-dev-exact-p4-benchmark:
    # Full HiGHS solve + established result assertions, NOT the 72-customer reproduction.
    if: github.ref == 'refs/heads/dev/optimizer-72-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run existing computed-enabled full HiGHS P4 result regression
        run: npx vitest run src/domain/optimizerP4.test.ts -t "solves the Blender workload through the production solver with the current certified optimum" --reporter=verbose


  optimizer-dev-72-proxy-full-solve:
    # Opt-in only via a marked dev push; do not prolong ordinary CI/PR checks.
    # This is canonical-data 72-selected proxy, not a player's captured request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/optimizer-72-runtime' && contains(github.event.head_commit.message, '[72-proxy]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run bounded canonical-data 72-customer proxy through real optimizer
        env:
          OPTIMIZER_DEV_72_PROXY: '1'
        run: npx vitest run src/domain/optimizerDev72ProxyProfile.test.ts --reporter=verbose


  dev-customer-search-isolation-diagnosis:
    # Opt-in only for the dedicated dev diagnosis PR; not a production acceptance change.
    # An isolated Vitest process per trial separates browser timing from other Vitest files.
    if: github.event_name == 'pull_request' && github.base_ref == 'dev/optimizer-72-runtime' && startsWith(github.head_ref, 'diagnosis/customer-search-perf-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture runner and browser versions
        run: |
          node --version
          npm --version
          if command -v google-chrome >/dev/null; then google-chrome --version; fi
          if command -v chromium >/dev/null; then chromium --version; fi
          if command -v chromedriver >/dev/null; then chromedriver --version; fi
          nproc
      - name: Compare three standalone customer-search timing trials
        shell: bash
        env:
          CI: 'true'
        run: |
          failures=0
          for trial in 1 2 3; do
            echo "::group::Standalone trial ${trial}/3"
            if npx vitest run src/customerSearchResponsivenessPerformance.test.mjs --reporter=verbose; then
              echo "Trial ${trial}: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Trial ${trial}: FAIL" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
            echo '::endgroup::'
          done
          echo "Failed standalone trials: ${failures}/3" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like
