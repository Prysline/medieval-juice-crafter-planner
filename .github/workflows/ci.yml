name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-187-branch21-sum122-pair-customer:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch21-sum122-pair-customer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply diagnosis-only exact pair selectors
        run: python .github/diagnostics/apply-branch20-pair-choice-selectors.py
      - name: Solve identity 187 branch 21 sum122 pair by next sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '21:0:required'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '122'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_FIRST_IDENTITIES: '1208'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SECOND_IDENTITIES: '1368'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-cost-role-187-branch21-sum122-pair-customer.log
      - name: Upload identity 187 branch 21 sum122 pair-customer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-cost-role-187-branch21-sum122-pair-customer
          path: machine-forced-cost-role-187-branch21-sum122-pair-customer.log
          if-no-files-found: error
