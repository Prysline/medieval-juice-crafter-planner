name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-457:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-457 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: b22-r1-forbidden
            cases: '22:1:forbidden'
          - shard: b22-r2-forbidden
            cases: '22:2:forbidden'
          - shard: b23-r1-forbidden
            cases: '23:1:forbidden'
          - shard: b23-r2-forbidden
            cases: '23:2:forbidden'
          - shard: b24-r1-forbidden
            cases: '24:1:forbidden'
          - shard: b24-r4-forbidden
            cases: '24:4:forbidden'
          - shard: b28-r1-forbidden
            cases: '28:1:forbidden'
          - shard: b28-r2-forbidden
            cases: '28:2:forbidden'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Close smallest identity 457 cost-role cases
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '457'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: ${{ matrix.cases }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
