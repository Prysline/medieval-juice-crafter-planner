name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like


  machine-1279-robustness:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-1279-robustness (${{ matrix.slice.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          - { name: e, branches: '12,13,14' }
          - { name: g, branches: '18,19,20' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Recheck historically flaky 1279 shards
        env:
          MACHINE_CONTINUATION_1279_BASE_BRANCHES: ${{ matrix.slice.branches }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1


  machine-forced-pair-609:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-pair-609 (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [3, 15, 26, 27, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check deterministic Hugo + Patricia pairs for identity 609
        env:
          MACHINE_CONTINUATION_FORCED_PAIR_GROUP: '609'
          MACHINE_CONTINUATION_FORCED_PAIR_BRANCHES: ${{ matrix.branch }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1

  machine-forced-third-609:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-third-609 (${{ matrix.slice.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          - { name: b26, cases: '26:1:1,26:1:3,26:1:5,26:2:1,26:2:5,26:3:3,26:4:3' }
          - { name: b27, cases: '27:1:1,27:1:3,27:1:5,27:2:3,27:3:1,27:3:3' }
          - { name: b33, cases: '33:1:1,33:1:3,33:1:5,33:2:1,33:2:3,33:3:1,33:3:3,33:3:4,33:3:5,33:4:1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine remaining identity 609 pairs by third sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_THIRD_GROUP: '609'
          MACHINE_CONTINUATION_FORCED_THIRD_CASES: ${{ matrix.slice.cases }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1

  machine-forced-fourth-609:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-fourth-609 (${{ matrix.slice.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          - { name: b26, cases: '26:1:1:0,26:1:1:1,26:1:1:2,26:1:1:5,26:1:3:1,26:1:3:4,26:1:3:5,26:1:3:6,26:1:5:2,26:1:5:5,26:2:1:1,26:2:1:4,26:2:1:5,26:2:5:5,26:3:3:2,26:3:3:4,26:3:3:5,26:4:3:4,26:4:3:5' }
          - { name: b27, cases: '27:1:1:0,27:1:1:1,27:1:1:5,27:1:3:1,27:1:3:2,27:1:3:5,27:2:3:1,27:2:3:2,27:2:3:4,27:2:3:5,27:3:1:2,27:3:1:5,27:3:3:0,27:3:3:1,27:3:3:2,27:3:3:5' }
          - { name: b33, cases: '33:1:1:0,33:1:1:1,33:1:1:5,33:1:3:1,33:1:3:2,33:1:3:4,33:2:1:5,33:2:1:6,33:2:3:1,33:2:3:4,33:3:1:1,33:3:1:5,33:3:3:0,33:3:3:4,33:3:3:5,33:3:5:5' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine identity 609 survivors by fourth sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_FOURTH_GROUP: '609'
          MACHINE_CONTINUATION_FORCED_FOURTH_CASES: ${{ matrix.slice.cases }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1

  machine-forced-fifth-609:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-fifth-609 (${{ matrix.slice.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          - { name: b26, cases: '26:1:3:1:4,26:1:3:4:1,26:1:3:5:1,26:1:3:5:6,26:2:1:5:6,26:3:3:2:4,26:3:3:5:1,26:3:3:5:4,26:3:3:5:7,26:4:3:5:4' }
          - { name: b27, cases: '27:1:1:0:1,27:1:1:1:6,27:1:1:5:4,27:1:1:5:6,27:1:3:1:4,27:1:3:5:2,27:1:3:5:4,27:2:3:5:4,27:2:3:5:7,27:3:1:5:4,27:3:1:5:6,27:3:3:5:4,27:3:3:5:5' }
          - { name: b33, cases: '33:1:1:0:4,33:1:1:5:4,33:1:1:5:6,33:1:3:1:6,33:1:3:2:4,33:1:3:4:1,33:2:1:5:2,33:2:1:5:4,33:2:1:5:6,33:2:1:5:7,33:2:3:1:4,33:2:3:1:6,33:2:3:4:4,33:3:1:5:1,33:3:1:5:4,33:3:1:5:6,33:3:1:5:7,33:3:3:4:4,33:3:3:5:1,33:3:3:5:2,33:3:3:5:4,33:3:3:5:6,33:3:5:5:2,33:3:5:5:4,33:3:5:5:6' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine identity 609 survivors by fifth sparse customer
        env:
          MACHINE_CONTINUATION_FORCED_FIFTH_GROUP: '609'
          MACHINE_CONTINUATION_FORCED_FIFTH_CASES: ${{ matrix.slice.cases }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1

