name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like


  machine-continuation-profile:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-continuation-profile (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        case:
          - '4+1:0'
          - '4+1:1'
          - '4+1:4'
          - '3+2:0'
          - '3+2:2'
          - '3+2:3'
          - '3+1+1:0'
          - '3+1+1:1'
          - '3+1+1:3'
          - '2+2+1:0'
          - '2+2+1:1'
          - '2+2+1:2'
          - '2+1+1+1:0'
          - '2+1+1+1:1'
          - '2+1+1+1:2'
          - '1+1+1+1+1:0'
          - '1+1+1+1+1:1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run isolated machine continuation profiler
        env:
          MACHINE_CONTINUATION_PROFILE: '1'
          MACHINE_CONTINUATION_PROFILE_CASE: ${{ matrix.case }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
