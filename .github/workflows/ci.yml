name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-187-branch38:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch38 (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 'r097'
            case: '38:0:required'
            sums: '97'
          - id: 'r098'
            case: '38:0:required'
            sums: '98'
          - id: 'r099'
            case: '38:0:required'
            sums: '99'
          - id: 'r100'
            case: '38:0:required'
            sums: '100'
          - id: 'r101'
            case: '38:0:required'
            sums: '101'
          - id: 'r102'
            case: '38:0:required'
            sums: '102'
          - id: 'r103'
            case: '38:0:required'
            sums: '103'
          - id: 'r104'
            case: '38:0:required'
            sums: '104'
          - id: 'r105'
            case: '38:0:required'
            sums: '105'
          - id: 'r106'
            case: '38:0:required'
            sums: '106'
          - id: 'r107'
            case: '38:0:required'
            sums: '107'
          - id: 'r108'
            case: '38:0:required'
            sums: '108'
          - id: 'r115'
            case: '38:0:required'
            sums: '115'
          - id: 'r116'
            case: '38:0:required'
            sums: '116'
          - id: 'r117'
            case: '38:0:required'
            sums: '117'
          - id: 'r118'
            case: '38:0:required'
            sums: '118'
          - id: 'r119'
            case: '38:0:required'
            sums: '119'
          - id: 'r120'
            case: '38:0:required'
            sums: '120'
          - id: 'f103'
            case: '38:0:forbidden'
            sums: '103'
          - id: 'f104'
            case: '38:0:forbidden'
            sums: '104'
          - id: 'f105'
            case: '38:0:forbidden'
            sums: '105'
          - id: 'f106'
            case: '38:0:forbidden'
            sums: '106'
          - id: 'f107'
            case: '38:0:forbidden'
            sums: '107'
          - id: 'f108'
            case: '38:0:forbidden'
            sums: '108'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Solve identity 187 branch 38 exact cost-role frontier
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_SUMS: '${{ matrix.sums }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-cost-role-187-${{ matrix.id }}.log
      - name: Upload identity 187 branch 38 exact cost-role log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-cost-role-187-${{ matrix.id }}
          path: machine-forced-cost-role-187-${{ matrix.id }}.log
          if-no-files-found: error
