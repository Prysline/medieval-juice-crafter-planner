name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-pair-187:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-pair-187 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            branches: '14,15'
          - shard: b
            branches: '20,21'
          - shard: c
            branches: '26,27'
          - shard: d
            branches: '32,33'
          - shard: e
            branches: '34,38'
          - shard: f
            branches: '39,44'
          - shard: g
            branches: '45,50'
          - shard: h
            branches: '51'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refine identity 187 by deterministic Hugo + Patricia pairs
        env:
          MACHINE_CONTINUATION_FORCED_PAIR_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_PAIR_BRANCHES: '${{ matrix.branches }}'
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
