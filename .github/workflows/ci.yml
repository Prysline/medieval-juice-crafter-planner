name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-role-457:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-role-457 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            branches: '0,2,3,4,8,9'
          - shard: b
            branches: '14,15,18,19,20,21'
          - shard: c
            branches: '22,23,24,26,27,28'
          - shard: d
            branches: '29,30,31,32,33,34'
          - shard: e
            branches: '35,38,39,40,43,44'
          - shard: f
            branches: '45,50,51'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Split identity 457 unresolved branches by exact extra-one roles
        env:
          MACHINE_CONTINUATION_FORCED_ROLE_GROUP: '457'
          MACHINE_CONTINUATION_FORCED_ROLE_BRANCHES: ${{ matrix.branches }}
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
