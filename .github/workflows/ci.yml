name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-sixth-187-small-tail:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-sixth-187-small-tail (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            cases: '38:3:5:5:0:0,38:3:5:5:0:1,38:3:5:5:4:5,51:1:1:5:4:3,51:1:3:5:4:5,51:1:3:5:4:6,51:1:3:5:6:5,51:1:4:5:4:5'
          - shard: b
            cases: '51:1:4:5:6:5,51:3:1:5:1:0,51:3:1:5:4:5,51:3:3:5:4:5,51:3:3:5:4:6,51:3:3:5:6:2,51:3:3:5:6:5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Close identity 187 small fifth-level tails by Heloise sixth-level cases
        env:
          MACHINE_CONTINUATION_FORCED_SIXTH_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_SIXTH_CASES: '${{ matrix.cases }}'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-sixth-187-${{ matrix.shard }}.log
      - name: Upload identity 187 sixth-level diagnosis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-sixth-187-${{ matrix.shard }}
          path: machine-forced-sixth-187-${{ matrix.shard }}.log
          if-no-files-found: error
