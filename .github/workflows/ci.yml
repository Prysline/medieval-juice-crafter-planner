name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-457:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-457 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: b27-r0-required
            cases: '27:0:required'
          - shard: b27-r1-required
            cases: '27:1:required'
          - shard: b27-r1-forbidden
            cases: '27:1:forbidden'
          - shard: b27-r2-required
            cases: '27:2:required'
          - shard: b27-r2-forbidden
            cases: '27:2:forbidden'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Resolve identity 457 branch 27 cost-role cases
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '457'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: ${{ matrix.cases }}
          MACHINE_CONTINUATION_FORCED_COST_ROLE_PAIR_CUSTOMER: '1'
        run: npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1
