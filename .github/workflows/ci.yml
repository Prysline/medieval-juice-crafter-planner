name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dev-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run smoke:highs:dev
      - run: npm test
      - run: npm run build
      - run: npm run smoke:highs:pages-like

  machine-forced-cost-role-187-branch21-sum-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/exact-machine-operation-continuation'
    name: machine-forced-cost-role-187-branch21-sum-audit (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: r0-required
            case: '21:0:required'
          - id: r0-forbidden
            case: '21:0:forbidden'
          - id: r1-required
            case: '21:1:required'
          - id: r1-forbidden
            case: '21:1:forbidden'
          - id: r2-required
            case: '21:2:required'
          - id: r2-forbidden
            case: '21:2:forbidden'
          - id: r4-forbidden
            case: '21:4:forbidden'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit identity 187 branch 21 canonical cost sums
        env:
          MACHINE_CONTINUATION_FORCED_COST_ROLE_GROUP: '187'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_CASES: '${{ matrix.case }}'
          MACHINE_CONTINUATION_FORCED_COST_ROLE_LIST_SUMS: '1'
        run: |
          set -o pipefail
          npx vitest run src/domain/optimizerMachineContinuationProfile.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee machine-forced-cost-role-187-branch21-sum-audit-${{ matrix.id }}.log
      - name: Upload identity 187 branch 21 sum audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-forced-cost-role-187-branch21-sum-audit-${{ matrix.id }}
          path: machine-forced-cost-role-187-branch21-sum-audit-${{ matrix.id }}.log
          if-no-files-found: error
