name: P4 split through-seasoning production A/B

on:
  push:
    branches:
      - perf/split-through-seasoning-certificate
    paths:
      - .github/workflows/p4-split-through-seasoning-production-ab.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Compare production P4 on one runner
        shell: bash
        run: |
          set -euo pipefail
          BASE=11fcbcda9f80fa35e8395f7c466c8007a226b639
          VARIANT=c38897b48635860f55fb11ed43da128afec8813a
          git fetch origin main perf/split-through-seasoning-certificate

          run_p4() {
            local label="$1"
            local ref="$2"
            git checkout --force "$ref" >/dev/null
            local started ended elapsed
            started=$(date +%s%3N)
            npx vitest run src/domain/optimizerP4.test.ts --reporter=verbose
            ended=$(date +%s%3N)
            elapsed=$((ended - started))
            echo "[P4 production A/B] ${label} elapsedMs=${elapsed} ref=${ref}"
          }

          run_p4 baseline-a "$BASE"
          run_p4 variant-a "$VARIANT"
          run_p4 variant-b "$VARIANT"
          run_p4 baseline-b "$BASE"
