name: P4 seasoning root-split diagnosis

on:
  pull_request:
    paths:
      - 'src/domain/optimizerSeasoningRootSplitDiagnosis.test.ts'
      - '.github/workflows/p4-seasoning-root-split-diagnosis.yml'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      P4_SEASONING_ROOT_SPLIT_DIAGNOSIS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vitest run src/domain/optimizerSeasoningRootSplitDiagnosis.test.ts --reporter=verbose
