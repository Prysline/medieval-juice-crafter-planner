name: Optimizer Non-Cost Machine Certificate 69 Fine Diagnosis

on:
  push:
    branches:
      - diagnosis/non-cost-machine-certificate
    paths:
      - .github/workflows/optimizer-non-cost-machine-certificate-69-fine-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnosis/non-cost-machine-certificate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Disable direct through-blending diagnosis fast path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/optimizerHighsSolver.ts')
          text = path.read_text()
          old = """  const directPartitions: ProductionStepKind[][] = [\n    ['juicing', 'seasoning', 'blending'],\n    ['finalizing'],\n  ]"""
          new = "  const directPartitions: ProductionStepKind[][] = []"
          if old not in text:
              raise SystemExit('direct partition target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run 69-customer finer partition diagnosis
        env:
          OPTIMIZER_POST_MAX_COST_MACHINE_CERTIFICATE_PROFILE: '1'
          OPTIMIZER_POST_MAX_COST_MACHINE_CERTIFICATE_CUSTOMERS: '69'
        run: >-
          npx vitest run
          src/domain/optimizerPostMaximumCostMachineCertificateProfile.test.ts
          --reporter=verbose
