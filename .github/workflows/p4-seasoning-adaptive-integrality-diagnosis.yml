name: P4 seasoning adaptive-integrality diagnosis

on:
  pull_request:
    paths:
      - 'src/domain/optimizerSeasoningAdaptiveIntegralityDiagnosis.test.ts'
      - '.github/workflows/p4-seasoning-adaptive-integrality-diagnosis.yml'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      P4_SEASONING_ADAPTIVE_INTEGRALITY_DIAGNOSIS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vitest run src/domain/optimizerSeasoningAdaptiveIntegralityDiagnosis.test.ts --reporter=verbose
