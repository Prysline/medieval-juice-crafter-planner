name: P4 exact production-unit tightening benchmark

on:
  pull_request:
    paths:
      - 'src/domain/optimizerHighsSolver.ts'
      - 'src/domain/optimizerMachineProductionUnitsTightening.test.ts'
      - '.github/workflows/p4-production-units-fix-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run same-runner P4 ABBA
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          run_case() {
            local ref="$1"
            local label="$2"
            git checkout --force "$ref"
            echo "=== $label @ $(git rev-parse HEAD) ==="
            npx vitest run src/domain/optimizerP4.test.ts \
              -t 'solves the Blender workload through the production solver with the current certified optimum' \
              --reporter=verbose | tee "/tmp/${label}.log"
          }

          run_case "$BASE_SHA" baseline-a
          run_case "$HEAD_SHA" variant-a
          run_case "$HEAD_SHA" variant-b
          run_case "$BASE_SHA" baseline-b

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          labels = ['baseline-a', 'variant-a', 'variant-b', 'baseline-b']
          values = {}
          pattern = re.compile(r'Blender production solve: ([0-9]+) ms')
          for label in labels:
              text = Path(f'/tmp/{label}.log').read_text()
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'missing P4 timing for {label}')
              values[label] = int(match.group(1))

          baseline_mean = (values['baseline-a'] + values['baseline-b']) / 2
          variant_mean = (values['variant-a'] + values['variant-b']) / 2
          summary = {
              **values,
              'baselineMeanMs': baseline_mean,
              'variantMeanMs': variant_mean,
              'variantToBaselineRatio': variant_mean / baseline_mean,
              'improvementPercent': (1 - variant_mean / baseline_mean) * 100,
          }
          print(f'[P4 exact production-unit tightening A/B] {json.dumps(summary)}')
          PY
