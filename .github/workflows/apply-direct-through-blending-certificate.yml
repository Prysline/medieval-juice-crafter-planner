name: Apply direct through-blending certificate diagnosis

on:
  push:
    branches:
      - diagnosis/non-cost-machine-certificate
    paths:
      - .github/workflows/apply-direct-through-blending-certificate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnosis/non-cost-machine-certificate
          fetch-depth: 0
      - name: Apply direct certificate patch
        run: python scripts/apply-direct-through-blending-certificate.py
      - name: Commit diagnosis source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/optimizerHighsSolver.ts
          git commit -m 'Debug: try direct through-blending machine certificate'
          git push origin HEAD:diagnosis/non-cost-machine-certificate
