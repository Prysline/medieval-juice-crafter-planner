name: P4 exact-ceiling production A/B

on:
  push:
    branches:
      - diagnosis/p4-machine-partition-timing
    paths:
      - .github/workflows/p4-exact-ceiling-production-ab.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Compare production P4 on one runner
        shell: bash
        run: |
          set -euo pipefail
          BASE=11fcbcda9f80fa35e8395f7c466c8007a226b639
          VARIANT=d0bd65afd8f71c502c7617a3641d77b00d9b106d
          git fetch origin main perf/exact-ceiling-machine-certificate

          run_p4() {
            local label="$1"
            local ref="$2"
            git checkout --force "$ref" >/dev/null
            local started ended elapsed
            started=$(date +%s%3N)
            npx vitest run src/domain/optimizerP4.test.ts --reporter=verbose
            ended=$(date +%s%3N)
            elapsed=$((ended - started))
            echo "[P4 production A/B] ${label} elapsedMs=${elapsed} ref=${ref}"
          }

          run_p4 baseline-a "$BASE"
          run_p4 variant-a "$VARIANT"
          run_p4 variant-b "$VARIANT"
          run_p4 baseline-b "$BASE"
