name: Optimizer Phase F Canonical-12 Prototype

on:
  pull_request:
    paths:
      - src/domain/optimizerLbbdCanonical12Prototype.test.ts
      - src/domain/optimizerHighsSolver.ts
      - src/domain/optimizerModel.ts
      - src/domain/optimizerCertificates.ts
      - src/domain/recipeCandidatePool.ts
      - .github/workflows/optimizer-phase-f-canonical12-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-12:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Phase F canonical-12 prototype
        env:
          OPTIMIZER_PHASE_F_CANONICAL12_PROTOTYPE: '1'
        run: >-
          npx vitest run
          src/domain/optimizerLbbdCanonical12Prototype.test.ts
          --reporter=verbose
