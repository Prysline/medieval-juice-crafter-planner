name: Optimizer Phase G Canonical-32 Prototype

on:
  pull_request:
    paths:
      - src/domain/optimizerLbbdCanonical32Prototype.test.ts
      - src/domain/optimizerLbbdCanonical12Prototype.test.ts
      - src/domain/optimizerHighsSolver.ts
      - src/domain/optimizerModel.ts
      - src/domain/optimizerCertificates.ts
      - src/domain/recipeCandidatePool.ts
      - .github/workflows/optimizer-phase-g-canonical32-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Phase G canonical-32 prototype
        env:
          OPTIMIZER_PHASE_G_CANONICAL32_PROTOTYPE: '1'
        run: >-
          npx vitest run
          src/domain/optimizerLbbdCanonical32Prototype.test.ts
          --reporter=verbose
