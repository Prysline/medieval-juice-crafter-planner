name: P4 seasoning relaxed-x diagnosis

on:
  pull_request:
    paths:
      - 'src/domain/optimizerSeasoningRelaxedRecipeUnitsDiagnosis.test.ts'
      - '.github/workflows/p4-seasoning-relaxed-x-diagnosis.yml'

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      P4_SEASONING_RELAXED_X_DIAGNOSIS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vitest run src/domain/optimizerSeasoningRelaxedRecipeUnitsDiagnosis.test.ts --reporter=verbose
