name: Apply exact-ceiling production slice

on:
  push:
    branches:
      - perf/exact-ceiling-machine-certificate
    paths:
      - .github/workflows/apply-exact-ceiling-production-slice.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/exact-ceiling-machine-certificate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply scoped solver patch and regression
        shell: python
        run: |
          from pathlib import Path

          solver = Path('src/domain/optimizerHighsSolver.ts')
          text = solver.read_text()
          replacements = [
              (
                  "  tightenOperationBoundsFromRecipeBounds?: boolean\n  machineOperationKinds?: Set<ProductionStepKind>\n",
                  "  tightenOperationBoundsFromRecipeBounds?: boolean\n  exactMachineOperationCeilingLink?: boolean\n  machineOperationKinds?: Set<ProductionStepKind>\n",
              ),
              (
                  "        model.addConstraint(\n          operationCount.minus(quantityExpression).leq(0),\n          `operation_usage_${edgeIndex}`,\n        )\n",
                  "        model.addConstraint(\n          options.exactMachineOperationCeilingLink\n            ? operationCount\n                .times(PROCESSING_STACK_CAPACITY)\n                .minus(quantityExpression)\n                .leq(PROCESSING_STACK_CAPACITY - 1)\n            : operationCount.minus(quantityExpression).leq(0),\n          `operation_usage_${edgeIndex}`,\n        )\n",
              ),
              (
                  "        tightenOperationBoundsFromRecipeBounds: true,\n        machineOperationKinds: new Set(partition.kinds),\n",
                  "        tightenOperationBoundsFromRecipeBounds: true,\n        exactMachineOperationCeilingLink: true,\n        machineOperationKinds: new Set(partition.kinds),\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one solver match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          solver.write_text(text)

          test = Path('src/domain/optimizerMachineOperationCeilingLink.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest'\nimport { PROCESSING_STACK_CAPACITY } from './inventoryRules'\n\ndescribe('machine operation exact ceiling link', () => {\n  it('permits exactly ceil(quantity / stack capacity), including zero', () => {\n    const maxQuantity = PROCESSING_STACK_CAPACITY * 3 + 2\n\n    for (let quantity = 0; quantity <= maxQuantity; quantity += 1) {\n      const expectedOperationCount = Math.ceil(\n        quantity / PROCESSING_STACK_CAPACITY,\n      )\n      const feasibleOperationCounts = Array.from(\n        { length: expectedOperationCount + 3 },\n        (_, operationCount) => operationCount,\n      ).filter(\n        (operationCount) =>\n          quantity <= PROCESSING_STACK_CAPACITY * operationCount &&\n          PROCESSING_STACK_CAPACITY * operationCount - quantity <=\n            PROCESSING_STACK_CAPACITY - 1,\n      )\n\n      expect(feasibleOperationCounts).toEqual([expectedOperationCount])\n    }\n  })\n})\n""")
      - name: Run focused exactness and certificate regressions
        run: npx vitest run src/domain/optimizerMachineOperationCeilingLink.test.ts src/domain/optimizerMachineCertificate.test.ts --reporter=verbose
      - name: Commit clean production diff
        run: |
          git rm .github/workflows/apply-exact-ceiling-production-slice.yml
          git add src/domain/optimizerHighsSolver.ts src/domain/optimizerMachineOperationCeilingLink.test.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Perf: tighten machine-certificate operation links"
          git push origin HEAD:perf/exact-ceiling-machine-certificate
