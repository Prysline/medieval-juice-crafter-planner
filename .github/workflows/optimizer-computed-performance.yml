name: Optimizer computed performance baseline

on:
  push:
    branches:
      - perf/computed-optimizer-paired-baseline
  workflow_dispatch:

jobs:
  paired-structure-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run trusted vs computed paired structural profile
        env:
          OPTIMIZER_PERF_PROFILE: '1'
        run: npx vitest run src/domain/optimizerPerformanceProfile.test.ts --reporter=verbose
