name: Apply through-seasoning-only ceiling link

on:
  push:
    branches:
      - perf/exact-ceiling-machine-certificate
    paths:
      - .github/workflows/apply-through-seasoning-only-ceiling.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/exact-ceiling-machine-certificate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Narrow exact ceiling to throughSeasoning
        shell: python
        run: |
          from pathlib import Path
          solver = Path('src/domain/optimizerHighsSolver.ts')
          text = solver.read_text()
          old = '        exactMachineOperationCeilingLink: true,\n'
          new = "        exactMachineOperationCeilingLink:\n          partition.key === 'throughSeasoning',\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one exact-ceiling opt-in, found {count}')
          solver.write_text(text.replace(old, new, 1))
      - name: Run focused certificate regression
        run: npx vitest run src/domain/optimizerMachineOperationCeilingLink.test.ts src/domain/optimizerMachineCertificate.test.ts --reporter=verbose
      - name: Commit clean production diff
        run: |
          git rm .github/workflows/apply-through-seasoning-only-ceiling.yml
          git add src/domain/optimizerHighsSolver.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Perf: scope exact ceiling to through-seasoning"
          git push origin HEAD:perf/exact-ceiling-machine-certificate
